name: CRECISOL C05 F06 complete 65-surface visual gate
on:
  push:
    branches: [feature/c05-ux-f06-mensajeria-estados-20261120]
    paths:
      - 'frontend/tests/c05-f06-inventory-65.spec.ts'
      - 'frontend/playwright.c05-f06-inventory65.config.ts'
      - 'qa/c05_ux_f06_65_coverage.py'
      - 'docs/c05/ux/F06_65_*'
      - '.github/workflows/c05-ux-f06-65-inventory.yml'
permissions:
  contents: read
concurrency:
  group: c05-f06-65-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-65:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Locked dependencies and Angular 22 build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          timeout 300s npx playwright install chromium
      - name: All 65 F01 surfaces in current F06 code, five screen widths
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f06-inventory65.config.ts --reporter=line
      - name: Fail closed on any of 65 missing, clipped, fake SHA or broken PNG
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/c05_ux_f06_65_coverage.py \
            frontend/test-results-f06-inventory65 \
            docs/c05/ux/F06_65_SUPERFICIES_VALORACION.csv
      - name: Preserve original individual images and trace on failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c05-f06-inventory-65-${{ github.sha }}
          path: frontend/test-results-f06-inventory65/
          if-no-files-found: warn
          retention-days: 14
