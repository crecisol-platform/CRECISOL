name: CRECISOL C05-10 institutional atomic rate budget and secret-free traces A-B-C real HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_10_2026_11_14.md'
      - 'qa/c05_10_closure_gate.py'
      - '.github/workflows/c05-10-certification.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_10_2026_11_14.md'
      - 'qa/c05_10_closure_gate.py'
      - '.github/workflows/c05-10-certification.yml'
permissions:
  contents: read
jobs:
  rate-limit-institutional:
    name: Three independent audits and 211+ genuine HTTP .NET10 MySQL8.4 trials with C05 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact institutional PR or dev SHA without persistent write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical master original C05-10 failure and remediated SHA lineage
        run: |
          set -euo pipefail
          test ! -e .c05-10-institutional-proof
          python3 -m py_compile qa/c05_10_closure_gate.py
          python3 qa/validate_foundation.py
          python3 qa/c05_10_closure_gate.py A
          mkdir -p .c05-10-institutional-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/A
      - name: Audit B verify denial budget and reject hostile HMAC and historical failure erasures
        run: |
          set -euo pipefail
          python3 qa/c05_10_closure_gate.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/B
      - name: Install reviewed .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile product API and isolated HMAC SQL anti-abuse harness strict
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.RateLimitAccess.MySqlTests/Crecisol.RateLimitAccess.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/build
      - name: Real loopback HTTP ASP.NET10 MySQL8.4 six rounds of 16 attempts 5 admitted 11 limited zero 503
        run: |
          set -euo pipefail
          bash database/tests/c05_10_rate_limit_http_mysql.sh
          printf 'PASS throttle sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/throttle
      - name: Regress all C05-01 through C05-09 authentication and private profiles on actual MySQL8.4
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj \
            backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.PrivateProfiles.MySqlTests/Crecisol.PrivateProfiles.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_09_private_profiles_http_mysql.sh
          dotnet build backend/tests/Crecisol.MfaRisk.MySqlTests/Crecisol.MfaRisk.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_08_mfa_http_mysql.sh
          dotnet build backend/tests/Crecisol.MailboxApproval.MySqlTests/Crecisol.MailboxApproval.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_07_mailbox_http_mysql.sh
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_06_recovery_http_mysql.sh
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/regressions
      - name: Audit C exact three-file original parent and same-run live MySQL and SHA
        run: |
          set -euo pipefail
          python3 qa/c05_10_closure_gate.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-10-institutional-proof/C
      - name: Confirm all genuine evidence A B C build throttle regressions on same SHA and run
        run: |
          set -euo pipefail
          for stage in A B C build throttle regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-10-institutional-proof/$stage"
          done
          echo 'PASS C05-10 synthetic admission and trace contract only; NO product authentication, session issuance or external services'
