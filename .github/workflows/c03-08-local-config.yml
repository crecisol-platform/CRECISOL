name: CRECISOL C03-08 local typed configuration A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/Configuration/**'
      - 'backend/src/Crecisol.Api/Program.cs'
      - 'backend/tests/Crecisol.LocalConfig.ContractsTests/**'
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'docs/c03/C03_08_*'
      - 'qa/c03_08_*'
      - '.github/workflows/c03-08-local-config.yml'
      - 'AGENTS.md'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/Configuration/**'
      - 'backend/src/Crecisol.Api/Program.cs'
      - 'backend/tests/Crecisol.LocalConfig.ContractsTests/**'
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'docs/c03/C03_08_*'
      - 'qa/c03_08_*'
      - '.github/workflows/c03-08-local-config.yml'
      - 'AGENTS.md'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
permissions:
  contents: read
jobs:
  c03-08-local-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A canonical Word and sequential C03 scope
        run: |
          python3 -m py_compile qa/c03_08_local_config_audits.py
          python3 qa/c03_08_local_config_audits.py A
      - name: Audit B 18 adversarial configuration mutations
        run: python3 qa/c03_08_local_config_audits.py B
      - name: Install .NET10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build real API and local configuration tests Release
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.LocalConfig.ContractsTests/Crecisol.LocalConfig.ContractsTests.csproj -c Release --nologo
          mkdir -p .c03-08-ci-proof
          printf 'PASS: build\n' > .c03-08-ci-proof/build
      - name: Execute typed C03-08 local positive and negative contracts
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.LocalConfig.ContractsTests/Crecisol.LocalConfig.ContractsTests.csproj
          printf 'PASS: contracts\n' > .c03-08-ci-proof/contracts
      - name: Real local profile and MySQL8.4 with read-only HTTP security
        run: |
          bash -n database/tests/c01_04_api_mysql_smoke.sh
          CRECISOL_C03_08_LOCAL_PROFILE_SMOKE=1 CRECISOL_C03_05_CONTRACT_SMOKE=1 bash database/tests/c01_04_api_mysql_smoke.sh
          printf 'PASS: mysql\n' > .c03-08-ci-proof/mysql
      - name: Regression prior stage C03-07 and historical documentary gates
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Api.ModuleTests/Crecisol.Api.ModuleTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Outbox.ContractsTests/Crecisol.Outbox.ContractsTests.csproj -- contracts
          python3 qa/c03_07_closure_gate.py
          python3 qa/c03_local_preflight.py
          python3 qa/test_c03_portability.py
          printf 'PASS: regressions\n' > .c03-08-ci-proof/regressions
      - name: Audit C physical graph and same-job executed proof
        run: python3 qa/c03_08_local_config_audits.py C
