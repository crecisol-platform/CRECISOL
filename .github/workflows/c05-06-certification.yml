name: CRECISOL C05-06 institutional one-use recovery A-B-C real HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_06_2026_11_13.md'
      - 'qa/c05_06_closure_gate.py'
      - '.github/workflows/c05-06-certification.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_06_2026_11_13.md'
      - 'qa/c05_06_closure_gate.py'
      - '.github/workflows/c05-06-certification.yml'
permissions:
  contents: read
jobs:
  scoped-recovery-certification:
    name: Word A/B/C and REAL disposable .NET10 HTTP MySQL8.4 one-time reset
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout exact immutable PR merge or dev SHA read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A source, prior C05-05 and evidence of real one-time reset
        run: |
          set -euo pipefail
          test ! -e .c05-06-closure-proof
          python3 -m py_compile qa/c05_06_closure_gate.py
          python3 qa/validate_foundation.py
          python3 qa/c05_06_closure_gate.py A
          mkdir -p .c05-06-closure-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/A
      - name: Audit B adversarial documentation and scope claim mutations
        run: |
          set -euo pipefail
          python3 qa/c05_06_closure_gate.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/B
      - name: Install official .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile product public API and test-only Argon2id reset .NET10
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/build
      - name: Re-execute REAL MySQL8.4 and local HTTP 10min one-use recovery
        run: |
          set -euo pipefail
          bash database/tests/c05_06_recovery_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/mysql
      - name: Execute real previous C05-01/02/03/04 and C05-05 session regressions
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/regressions
      - name: Audit C exact three-file diff, SHA/run, A/B and real HTTP/MySQL
        run: |
          set -euo pipefail
          python3 qa/c05_06_closure_gate.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-closure-proof/C
      - name: Require same SHA and run A B C build MySQL and prior contracts
        run: |
          set -euo pipefail
          for stage in A B C build mysql regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-06-closure-proof/$stage"
          done
          echo 'PASS ONLY isolated recovery HTTP/MySQL fixtures; no production mail, credentials or users'
