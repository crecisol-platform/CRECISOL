name: CRECISOL C03-09 real compatibility A-B-C Angular22 NET10 MySQL8.4

on:
  pull_request:
    branches: [dev]
    paths:
      - 'qa/c03_09_*'
      - 'qa/test_c03_09_*'
      - 'qa/c01_06_official_assets.py'
      - 'docs/c03/C03_09_*'
      - '.github/workflows/c03-09-compatibility.yml'
  push:
    branches: [dev]
    paths:
      - 'qa/c03_09_*'
      - 'qa/test_c03_09_*'
      - 'qa/c01_06_official_assets.py'
      - 'docs/c03/C03_09_*'
      - '.github/workflows/c03-09-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: crecisol-c03-09-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c03-09-integral:
    name: C03-09 canonical A-B, real build baselines, disposable MySQL8.4 C
    if: (github.event_name == 'pull_request' && github.head_ref == 'feature/c03-09-compat-benchmark-local') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CRECISOL_LOCAL_EVIDENCE_DIR: ${{ runner.temp }}/crecisol-c03-09-evidence
    steps:
      - name: Checkout exact source branch, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify branch, checkout, and immutable technical scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          case "$(git remote get-url origin)" in
            https://github.com/solqaryn-platform/CRECISOL|https://github.com/solqaryn-platform/CRECISOL.git) ;;
            *) exit 2 ;;
          esac
          case "$(git symbolic-ref --quiet --short HEAD)" in
            feature/c03-09-*|dev) ;;
            *) exit 2 ;;
          esac
          python3 qa/master_source_guard.py --self-test

      - name: Install pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install supported Node 24.15.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install supported NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Prepare locked frontend dependencies and restore known NET projects
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
          dotnet restore backend/src/Crecisol.Api/Crecisol.Api.csproj --nologo
          dotnet restore backend/tests/Crecisol.Outbox.ContractsTests/Crecisol.Outbox.ContractsTests.csproj --nologo

      - name: Cache only the digest-pinned disposable MySQL 8.4 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          docker image inspect mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902 --format '{{.Id}}'

      - name: Run authentic C03-09 source, negative, compatibility and smoke gates
        shell: bash
        run: |
          set -euo pipefail
          bash -n qa/c03_09_local_suite.sh
          bash qa/c03_09_local_suite.sh --run

      - name: Verify recorded A-B-C, file hashes and non-certification from evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          evidence_root = Path(os.environ['CRECISOL_LOCAL_EVIDENCE_DIR'])
          folders = list(evidence_root.glob('c03-09-*'))
          assert len(folders) == 1, 'Exactly one evidence folder required'
          folder = folders[0]
          manifest = json.loads((folder / 'manifest.json').read_text())
          probe = json.loads((folder / 'probe.json').read_text())
          result = json.loads((folder / 'C_runtime_benchmark.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert manifest['project'] == 'solqaryn-platform/CRECISOL'
          assert manifest['phase'] == 'C03-09' and manifest['commit'] == head
          assert manifest['audit_A_static_traceability'] == 'PASS'
          assert manifest['audit_B_negative_guards'] == 'PASS'
          assert manifest['audit_C_real_compatibility'] == 'EXECUTED'
          assert manifest['phase_certified'] is False
          assert manifest['ci_postmerge'] == 'NOT_CLAIMED'
          assert probe['status'] == 'READY' and probe['environment']['ready'] is True
          assert result['status'] == 'MEASURED_LOCAL_ONLY_NOT_CERTIFIED'
          assert result['real_compatibility_verified'] is True
          assert result['git_commit'] == head
          keys = ('dotnet_api_release_incremental_build', 'angular22_production_incremental_build',
                  'dotnet_outbox_contract_build')
          for key in keys:
              samples = result['metrics'][key]['samples_seconds']
              assert len(samples) >= 3 and all(isinstance(v, (int,float)) and v > 0 for v in samples)
          assert result['metrics']['mysql84_disposable_outbox_smoke']['duration_seconds'] > 0
          files = manifest['file_sha256']
          actual = {p.name for p in folder.iterdir() if p.is_file() and p.name != 'manifest.json'}
          assert set(files) == actual and len(files) == 16
          for name, expected in files.items():
              assert '/' not in name and '\\' not in name and name not in ('.','..')
              assert hashlib.sha256((folder / name).read_bytes()).hexdigest() == expected
          assert not (folder / 'probe_error.txt').read_bytes()
          assert not (folder / 'C_runtime_error.txt').read_bytes()
          print('PASS C03-09 CI: A/B/C, 9 builds, isolated MySQL8.4, 16 file digests, no certification claim')
          PY

      - name: Upload short-lived private C03-09 evidence for SHA review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CRECISOL-C03-09-LOCAL-ONLY-NOT-CERTIFIED
          path: ${{ runner.temp }}/crecisol-c03-09-evidence/c03-09-*/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
