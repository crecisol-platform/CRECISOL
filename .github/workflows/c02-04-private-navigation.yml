name: CRECISOL C02-04 private navigation contract and deny-by-default gate
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c02/C02_04_*'
      - 'docs/C02_PREPARACION.md'
      - 'qa/c02_04_*'
      - 'frontend/tests/c02-04.private-paths.spec.ts'
      - '.github/workflows/c02-04-private-navigation.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c02/C02_04_*'
      - 'docs/C02_PREPARACION.md'
      - 'qa/c02_04_*'
      - 'frontend/tests/c02-04.private-paths.spec.ts'
      - '.github/workflows/c02-04-private-navigation.yml'
permissions:
  contents: read
jobs:
  c02-private-contract:
    name: C02-04 Word + private navigation A/B/C + Chromium negatives + Angular22/.NET10
    if: startsWith(github.head_ref, 'feature/c02-04-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout CRECISOL read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify canonical Word and JSON and QA syntax
        run: |
          python3 -m py_compile qa/c02_01_source.py qa/c02_02_audits.py qa/c02_03_audits.py qa/c02_04_audits.py
          python3 -m json.tool docs/c02/C02_04_NAVEGACION_PRIVADA.json > /dev/null
          python3 qa/c02_01_source.py A
          python3 qa/c02_02_audits.py A
      - name: Regress C02-01/C02-02/C02-03 A B C chapter gates
        run: |
          python3 qa/c02_01_source.py B
          python3 qa/c02_01_source.py C
          python3 qa/c02_02_audits.py B
          python3 qa/c02_02_audits.py C
          python3 qa/c02_03_audits.py A
          python3 qa/c02_03_audits.py B
          python3 qa/c02_03_audits.py C
      - name: Audit A — Word and 4 contexts/12 real canonical needs
        run: python3 qa/c02_04_audits.py A
      - name: Audit B — backend-only security gates, no private routing and 9 mutations
        run: python3 qa/c02_04_audits.py B
      - name: Install Node 24.15.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Restore pinned Angular dependencies without lifecycle scripts
        run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Audit production dependency vulnerabilities
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Install real Chromium browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Check Angular22 types, production build and official assets
        run: |
          cd frontend
          npm run check:types
          npm run build
          npm run test:assets
      - name: Chromium C02-03 public and C02-04 private-path negatives and a11y
        run: |
          cd frontend
          npx playwright test tests/c02-03.public-information.spec.ts tests/c02-04.private-paths.spec.ts --reporter=line
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile existing ASP.NET Core 10 API Release
        run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
      - name: Audit C — versioned admin settings, UX, sequence and 4 mutations
        run: python3 qa/c02_04_audits.py C
      - name: Preserve browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C02-04-private-navigation-failed-checks
          path: frontend/test-results/
          retention-days: 3
          if-no-files-found: ignore
