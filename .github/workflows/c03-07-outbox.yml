name: CRECISOL C03-07 scoped outbox relay A-B-C MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Events/**'
      - 'backend/src/Crecisol.Application/Events/**'
      - 'backend/src/Crecisol.Infrastructure/Events/**'
      - 'backend/tests/Crecisol.Outbox.ContractsTests/**'
      - 'database/c03_07_*'
      - 'database/tests/c03_07_*'
      - 'docs/c03/C03_07_*'
      - 'qa/c03_07_*'
      - '.github/workflows/c03-07-outbox.yml'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - 'AGENTS.md'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Events/**'
      - 'backend/src/Crecisol.Application/Events/**'
      - 'backend/src/Crecisol.Infrastructure/Events/**'
      - 'backend/tests/Crecisol.Outbox.ContractsTests/**'
      - 'database/c03_07_*'
      - 'database/tests/c03_07_*'
      - 'docs/c03/C03_07_*'
      - 'qa/c03_07_*'
      - '.github/workflows/c03-07-outbox.yml'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - 'AGENTS.md'
permissions:
  contents: read
jobs:
  c03-07-outbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout read-only without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A Word scope and source traceability
        run: |
          python3 -m py_compile qa/c03_07_outbox_audits.py
          python3 qa/c03_07_outbox_audits.py A
      - name: Audit B 16 adversarial mutations and tenant isolation
        run: python3 qa/c03_07_outbox_audits.py B
      - name: Historical cross-platform status/portability regression
        run: python3 qa/test_c03_portability.py
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build API and outbox tests in Release warnings-as-errors
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.Outbox.ContractsTests/Crecisol.Outbox.ContractsTests.csproj -c Release --nologo
          mkdir -p .c03-07-ci-proof
          printf 'PASS: build\n' > .c03-07-ci-proof/build
      - name: Run typed Domain and Application outbox positive/negative contracts
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.Outbox.ContractsTests/Crecisol.Outbox.ContractsTests.csproj -- contracts
          printf 'PASS: contracts\n' > .c03-07-ci-proof/contracts
      - name: Execute disposable MySQL 8.4 transaction/concurrency/tenant security
        run: |
          bash -n database/tests/c03_07_outbox_mysql_smoke.sh
          bash database/tests/c03_07_outbox_mysql_smoke.sh
          printf 'PASS: mysql\n' > .c03-07-ci-proof/mysql
      - name: Regress C01-C03 contracts, API, public MySQL and HTTP
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ContractsTests/Crecisol.Branding.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ApplicationTests/Crecisol.Branding.ApplicationTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Application.ContractsTests/Crecisol.Application.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Infrastructure.ContractsTests/Crecisol.Infrastructure.ContractsTests.csproj -- contracts
          dotnet run -c Release --project backend/tests/Crecisol.Api.ContractsTests/Crecisol.Api.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Api.ModuleTests/Crecisol.Api.ModuleTests.csproj
          CRECISOL_C03_05_CONTRACT_SMOKE=1 bash database/tests/c01_04_api_mysql_smoke.sh
          printf 'PASS: regressions\n' > .c03-07-ci-proof/regressions
      - name: Audit C runtime evidence architecture and bounded processing
        run: python3 qa/c03_07_outbox_audits.py C
      - name: Independent C03-07 acta and 15 documentary adversarial mutations
        run: python3 qa/c03_07_closure_gate.py
