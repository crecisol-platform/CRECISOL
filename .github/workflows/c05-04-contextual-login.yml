name: CRECISOL C05-04 contextual login A-B-C real Argon2id NET10
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PrepareContextualPasswordLogin.cs'
      - 'backend/src/Crecisol.CredentialSecurity/Argon2idLoginCandidateVerifier.cs'
      - 'backend/tests/Crecisol.ContextualLogin.ContractsTests/**'
      - 'docs/c05/C05_04_ESPECIFICACION.md'
      - 'qa/c05_04_contextual_login_audits.py'
      - '.github/workflows/c05-04-contextual-login.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PrepareContextualPasswordLogin.cs'
      - 'backend/src/Crecisol.CredentialSecurity/Argon2idLoginCandidateVerifier.cs'
      - 'backend/tests/Crecisol.ContextualLogin.ContractsTests/**'
      - 'docs/c05/C05_04_ESPECIFICACION.md'
      - 'qa/c05_04_contextual_login_audits.py'
      - '.github/workflows/c05-04-contextual-login.yml'
permissions:
  contents: read
jobs:
  contextual-pre-session:
    name: Backend-only no-selector contextual login / 2 tenant negative gate
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact PR/dev SHA without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical source and C05-03 prerequisite
        run: |
          set -euo pipefail
          test ! -e .c05-04-contextual-proof
          python3 -m py_compile qa/c05_04_contextual_login_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_04_contextual_login_audits.py A
          mkdir -p .c05-04-contextual-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-04-contextual-proof/A
      - name: Audit B mutation/fail closed tenure, host and cryptographic security
        run: |
          set -euo pipefail
          python3 qa/c05_04_contextual_login_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-04-contextual-proof/B
      - name: Install pinned .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute real Argon2id two-tenant contextual login tests and API build
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj
          printf 'PASS net10 sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-04-contextual-proof/net10
      - name: Regress C05-01, C05-02 and C05-03 cryptographic contracts
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          printf 'PASS regression sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-04-contextual-proof/regression
      - name: Audit C strict scope, clean architecture and same-SHA actual evidence
        run: |
          set -euo pipefail
          python3 qa/c05_04_contextual_login_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-04-contextual-proof/C
      - name: Require A-B-C, NET10 and predecessors on same SHA/run
        run: |
          set -euo pipefail
          for stage in A B C net10 regression; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-04-contextual-proof/$stage"
          done
          echo 'PASS scoped C05-04 pre-session internal evidence only; no login API, cookies, JWT, tenant grants or production'
