name: CRECISOL C05-09 private tenant profiles and Cloudflare-style photo references A-B-C HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/C05_09_ESPECIFICACION.md'
      - 'backend/src/Crecisol.Domain/Identity/PrivateTenantProfileModels.cs'
      - 'backend/src/Crecisol.Application/Identity/PrivateTenantProfileUseCases.cs'
      - 'backend/src/Crecisol.CredentialSecurity/SyntheticPrivateProfileCipher.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposablePrivateProfileLedger.cs'
      - 'backend/tests/Crecisol.PrivateProfiles.MySqlTests/**'
      - 'database/tests/fixtures/c05_09_disposable_private_profiles.sql'
      - 'database/tests/c05_09_private_profiles_http_mysql.sh'
      - 'qa/c05_09_profile_audits.py'
      - '.github/workflows/c05-09-private-profiles.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/C05_09_ESPECIFICACION.md'
      - 'backend/src/Crecisol.Domain/Identity/PrivateTenantProfileModels.cs'
      - 'backend/src/Crecisol.Application/Identity/PrivateTenantProfileUseCases.cs'
      - 'backend/src/Crecisol.CredentialSecurity/SyntheticPrivateProfileCipher.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposablePrivateProfileLedger.cs'
      - 'backend/tests/Crecisol.PrivateProfiles.MySqlTests/**'
      - 'database/tests/fixtures/c05_09_disposable_private_profiles.sql'
      - 'database/tests/c05_09_private_profiles_http_mysql.sh'
      - 'qa/c05_09_profile_audits.py'
      - '.github/workflows/c05-09-private-profiles.yml'
permissions:
  contents: read
jobs:
  strict-private-tenant-profile:
    name: .NET10 AES256 GCM + real MySQL8.4 private PII media A/B/C and 16-way HTTP CAS
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact SHA without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word and ADR-015 ownership/scope
        run: |
          set -euo pipefail
          test ! -e .c05-09-profile-proof
          python3 -m py_compile qa/c05_09_profile_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_09_profile_audits.py A
          mkdir -p .c05-09-profile-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/A
      - name: Audit B mutate and reject PII/photo tenant bypass guards
        run: |
          set -euo pipefail
          python3 qa/c05_09_profile_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/B
      - name: Install official .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build product and isolated profile with warnings as errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.PrivateProfiles.MySqlTests/Crecisol.PrivateProfiles.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/build
      - name: Real ASP.NET10 loopback HTTP and disposable MySQL8.4 private self-profile 16-way CAS
        run: |
          set -euo pipefail
          bash database/tests/c05_09_private_profiles_http_mysql.sh
          printf 'PASS profiles sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/profiles
      - name: Genuine C05-01 through C05-08 regressions cryptography and MySQL HTTP
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj \
            backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.MfaRisk.MySqlTests/Crecisol.MfaRisk.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_08_mfa_http_mysql.sh
          dotnet build backend/tests/Crecisol.MailboxApproval.MySqlTests/Crecisol.MailboxApproval.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_07_mailbox_http_mysql.sh
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_06_recovery_http_mysql.sh
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/regressions
      - name: Audit C exact 11 files and current SHA/run proof of runtime + regressions
        run: |
          set -euo pipefail
          python3 qa/c05_09_profile_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-09-profile-proof/C
      - name: Assert A/B/C and all real tests same SHA/run (test-only)
        run: |
          set -euo pipefail
          for stage in A B C build profiles regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-09-profile-proof/$stage"
          done
          echo 'PASS C05-09 synthetic ONLY: encrypted self profiles and private media refs; no Cloudflare upload, product auth, KMS or user PII'
