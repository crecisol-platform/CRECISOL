name: CRECISOL C05-05 institutional scoped session closure A-B-C real HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_05_2026_11_13.md'
      - 'qa/c05_05_closure_gate.py'
      - '.github/workflows/c05-05-certification.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_05_2026_11_13.md'
      - 'qa/c05_05_closure_gate.py'
      - '.github/workflows/c05-05-certification.yml'
permissions:
  contents: read
jobs:
  certify-test-session-only:
    name: Exact Word and real HTTP MySQL8.4 rotation/logout A-B-C NET10
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact PR merge or dev SHA without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical source, scope, C05-04 and C05-05 technical evidence
        run: |
          set -euo pipefail
          test ! -e .c05-05-closure-proof
          python3 -m py_compile qa/c05_05_closure_gate.py
          python3 qa/validate_foundation.py
          python3 qa/c05_05_closure_gate.py A
          mkdir -p .c05-05-closure-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/A
      - name: Audit B negative mutations prohibit production session claims
        run: |
          set -euo pipefail
          python3 qa/c05_05_closure_gate.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/B
      - name: Install .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile actual API and real session integration test
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/build
      - name: Repeat REAL disposable MySQL8.4 and HTTP session issue rotate logout
        run: |
          set -euo pipefail
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/mysql
      - name: Regress real C05-01/02/03/04 NET10 security executable contracts
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/regressions
      - name: Audit C SHA lineage diff allowed and proof of real negative tests
        run: |
          set -euo pipefail
          python3 qa/c05_05_closure_gate.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-05-closure-proof/C
      - name: Require exact A-B-C build MySQL HTTP and prior regressions same SHA
        run: |
          set -euo pipefail
          for stage in A B C build mysql regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-05-closure-proof/$stage"
          done
          echo 'PASS C05-05 ONLY isolated HTTP/MySQL session contracts, not real user login or production'
