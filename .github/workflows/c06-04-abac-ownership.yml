name: CRECISOL C06-04 ABAC ownership and same-branch IDOR A-B-C-E2E
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Tenancy/C06CaseAbacPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Abac.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Authorized.cs'
      - 'backend/tests/Crecisol.C06Abac.ContractsTests/**'
      - 'database/migrations/020_c06_case_abac*'
      - 'database/operations/c06_04_*'
      - 'database/tests/c06_04_*'
      - 'docs/c06/C06_04_*'
      - 'qa/c06_04_*'
      - 'qa/c05_operational_flow_e2e.mjs'
      - 'qa/c06_03_context_audits.py'
      - '.github/workflows/c06-04-abac-ownership.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Tenancy/C06CaseAbacPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Abac.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Authorized.cs'
      - 'backend/tests/Crecisol.C06Abac.ContractsTests/**'
      - 'database/migrations/020_c06_case_abac*'
      - 'database/operations/c06_04_*'
      - 'database/tests/c06_04_*'
      - 'docs/c06/C06_04_*'
      - 'qa/c06_04_*'
      - 'qa/c05_operational_flow_e2e.mjs'
      - 'qa/c06_03_context_audits.py'
      - '.github/workflows/c06-04-abac-ownership.yml'
permissions:
  contents: read
jobs:
  a-source:
    name: A | Master, exact route/action inventory and scoped diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/master_source_guard.py
      - run: python3 qa/c06_04_abac_audits.py A
  b-offensive:
    name: B | Same-branch IDOR .NET and MySQL 8.4 negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_04_abac_audits.py B
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Contracts with 50+ DENY mutations and valid ownership/assignments
        run: |
          dotnet build backend/tests/Crecisol.C06Abac.ContractsTests/Crecisol.C06Abac.ContractsTests.csproj -c Release -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.C06Abac.ContractsTests/Crecisol.C06Abac.ContractsTests.csproj
      - name: Disposable MySQL 8.4 exact assignment integrity/revocation/rollback
        run: bash database/tests/c06_04_abac_mysql.sh
  c-architecture:
    name: C | Domain separation, .NET 10 Angular 22 compile and migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_04_abac_audits.py C
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: node --check qa/c05_operational_flow_e2e.mjs
      - name: Angular 22 unchanged functional/regression compile
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
  d-e2e:
    name: E2E | Real Chromium Angular Kestrel MySQL and same-branch IDOR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile real API, local SMTP receiver and test-only provisioner
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release -warnaserror
          dotnet build backend/tools/Crecisol.LocalIdentityProvisioner/Crecisol.LocalIdentityProvisioner.csproj -c Release -warnaserror
      - name: Angular + Chromium test runner
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Genuine private-case IDOR, exact assignment and revoke in real HTTP
        run: node qa/c05_operational_flow_e2e.mjs --c06-04
