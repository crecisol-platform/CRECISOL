name: CRECISOL C03-02 pure Domain contracts and A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/**'
      - 'backend/tests/Crecisol.Domain.ContractsTests/**'
      - 'docs/c03/C03_02_ESPECIFICACION.md'
      - 'qa/c03_02_domain_audits.py'
      - '.github/workflows/c03-02-domain.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/**'
      - 'backend/tests/Crecisol.Domain.ContractsTests/**'
      - 'docs/c03/C03_02_ESPECIFICACION.md'
      - 'qa/c03_02_domain_audits.py'
      - '.github/workflows/c03-02-domain.yml'
permissions:
  contents: read
jobs:
  c03-02-domain:
    if: startsWith(github.head_ref, 'feature/c03-02-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout CRECISOL without persisted write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A canonical Word and C03-02 source mapping
        run: |
          python3 -m py_compile qa/c03_02_domain_audits.py
          python3 qa/c03_02_domain_audits.py A
      - name: Audit B Domain boundaries and adversarial mutations
        run: python3 qa/c03_02_domain_audits.py B
      - name: Install .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile production API and pure Domain contracts in Release
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj -c Release --nologo
          mkdir -p .c03-02-ci-proof
          printf 'PASS: build\n' > .c03-02-ci-proof/build
      - name: Execute C03-02 positive and negative pure Domain contracts
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj
          printf 'PASS: c03-domain\n' > .c03-02-ci-proof/c03-domain
      - name: Regress C01 Branding Domain contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ContractsTests/Crecisol.Branding.ContractsTests.csproj
          printf 'PASS: c01-domain\n' > .c03-02-ci-proof/c01-domain
      - name: Regress Application contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ApplicationTests/Crecisol.Branding.ApplicationTests.csproj
          printf 'PASS: application\n' > .c03-02-ci-proof/application
      - name: Audit C actual compilation evidence, regressions and graph
        run: python3 qa/c03_02_domain_audits.py C
