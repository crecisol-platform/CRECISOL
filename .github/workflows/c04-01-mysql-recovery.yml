name: CRECISOL C04-01 MySQL8.4 final startup recovery A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'qa/c04_01_mysql_startup_audits.py'
      - 'docs/c04/C04_01_REMEDIACION_MYSQL_CI_2026_11_12.md'
      - '.github/workflows/c04-01-mysql-recovery.yml'
  push:
    branches: [dev]
    paths:
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'qa/c04_01_mysql_startup_audits.py'
      - 'docs/c04/C04_01_REMEDIACION_MYSQL_CI_2026_11_12.md'
      - '.github/workflows/c04-01-mysql-recovery.yml'
permissions:
  contents: read
jobs:
  mysql-final-server:
    name: C04-01 recovery .NET10 MySQL8.4 startup A-B-C
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout CRECISOL read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A incident provenance and final-server readiness contract
        run: |
          test ! -e .c04-01-mysql-proof
          python3 -m py_compile qa/c04_01_mysql_startup_audits.py
          bash -n database/tests/c01_04_api_mysql_smoke.sh
          python3 qa/c04_01_mysql_startup_audits.py A
          mkdir -p .c04-01-mysql-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-01-mysql-proof/A
      - name: Audit B reject unsafe startup/network mutations
        run: |
          python3 qa/c04_01_mysql_startup_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-01-mysql-proof/B
      - name: Install .NET 10 for actual API smoke
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build API Release and execute real isolated MySQL8.4
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          CRECISOL_C03_05_CONTRACT_SMOKE=1 CRECISOL_C03_08_LOCAL_PROFILE_SMOKE=1 bash database/tests/c01_04_api_mysql_smoke.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-01-mysql-proof/mysql
      - name: Audit C same-run A/B and MySQL evidence
        run: python3 qa/c04_01_mysql_startup_audits.py C
