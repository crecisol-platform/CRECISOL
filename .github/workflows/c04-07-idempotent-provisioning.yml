name: CRECISOL C04-07 synthetic idempotent provisioning A-B-C .NET10 MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Tenancy/TenantProvisioningIdempotency.cs'
      - 'backend/src/Crecisol.Application/Tenancy/ProvisionApprovedTenantDraft.cs'
      - 'backend/tests/Crecisol.TenantProvisioning.ContractsTests/**'
      - 'database/tests/c04_07_*'
      - 'qa/c04_07_idempotency_audits.py'
      - 'docs/c04/C04_07_*'
      - '.github/workflows/c04-07-idempotent-provisioning.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Tenancy/TenantProvisioningIdempotency.cs'
      - 'backend/src/Crecisol.Application/Tenancy/ProvisionApprovedTenantDraft.cs'
      - 'backend/tests/Crecisol.TenantProvisioning.ContractsTests/**'
      - 'database/tests/c04_07_*'
      - 'qa/c04_07_idempotency_audits.py'
      - 'docs/c04/C04_07_*'
      - '.github/workflows/c04-07-idempotent-provisioning.yml'
permissions:
  contents: read
jobs:
  c04-07-idempotency:
    name: C04-07 InnoDB transaction races + .NET10 A-B-C (no production)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CRECISOL with no write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: A verify original master, SQL scripts syntax and prior C04 gates
        run: |
          test ! -e .c04-07-idempotency-proof
          python3 -m py_compile qa/c04_07_idempotency_audits.py
          bash -n database/tests/c04_07_idempotency_smoke.sh
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c04_01_normative_inventory.py verify
          python3 qa/c04_01_contracts_audits.py A
          python3 qa/c04_02_implementation_audits.py A
          python3 qa/c04_03_contracts_audits.py A
          python3 qa/c04_04_hosts_audits.py A
          python3 qa/c04_05_identity_audits.py A
          python3 qa/c04_06_scope_audits.py A
          python3 qa/c04_07_idempotency_audits.py A
          mkdir -p .c04-07-idempotency-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-07-idempotency-proof/A
      - name: B reject trust-boundary and transactional uniqueness mutations
        run: |
          python3 qa/c04_01_contracts_audits.py B
          python3 qa/c04_02_implementation_audits.py B
          python3 qa/c04_03_contracts_audits.py B
          python3 qa/c04_04_hosts_audits.py B
          python3 qa/c04_05_identity_audits.py B
          python3 qa/c04_06_scope_audits.py B
          python3 qa/c04_07_idempotency_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-07-idempotency-proof/B
      - name: Install exact .NET 10 SDK family
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build real API and C04-07 .NET10 Release warnings as errors
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.TenantProvisioning.ContractsTests/Crecisol.TenantProvisioning.ContractsTests.csproj -c Release --nologo -warnaserror
      - name: Run .NET10 idempotency and all preceding tenancy regressions
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.TenantProvisioning.ContractsTests/Crecisol.TenantProvisioning.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.BranchResource.ContractsTests/Crecisol.BranchResource.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.TenantIdentity.ContractsTests/Crecisol.TenantIdentity.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.VerifiedHosts.ContractsTests/Crecisol.VerifiedHosts.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.TenantStorage.ContractsTests/Crecisol.TenantStorage.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.TenantCatalog.ContractsTests/Crecisol.TenantCatalog.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.SharedTenancy.ContractsTests/Crecisol.SharedTenancy.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Api.ContractsTests/Crecisol.Api.ContractsTests.csproj
          printf 'PASS dotnet sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-07-idempotency-proof/dotnet
      - name: Real offline Docker MySQL8.4 concurrency and crash recovery
        run: |
          bash database/tests/c04_07_idempotency_smoke.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c04-07-idempotency-proof/mysql
      - name: C verify A-B-.NET-MySQL same SHA run and clean architecture
        run: python3 qa/c04_07_idempotency_audits.py C
