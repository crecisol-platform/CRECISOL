name: CRECISOL C02-03 public information and secure routing
on:
  pull_request:
    branches: [dev]
    paths:
      - 'qa/c02_03_*'
      - 'docs/c02/C02_03_*'
      - 'docs/C02_PREPARACION.md'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/pages/public-information.*'
      - 'frontend/src/app/pages/platform-home.component.html'
      - 'frontend/tests/c02-03.public-information.spec.ts'
      - '.github/workflows/c02-03-public-ia.yml'
  push:
    branches: [dev]
    paths:
      - 'qa/c02_03_*'
      - 'docs/c02/C02_03_*'
      - 'docs/C02_PREPARACION.md'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/pages/public-information.*'
      - 'frontend/src/app/pages/platform-home.component.html'
      - 'frontend/tests/c02-03.public-information.spec.ts'
      - '.github/workflows/c02-03-public-ia.yml'
permissions:
  contents: read
jobs:
  public-ia:
    name: C02-03 Word + public Angular22 routes + Chromium + A/B/C
    if: startsWith(github.head_ref, 'feature/c02-03-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Read-only CRECISOL checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate pinned Word and Python/JSON syntax
        run: |
          python3 -m py_compile qa/c02_01_source.py qa/c02_02_audits.py qa/c02_03_audits.py
          python3 -m json.tool docs/c02/C02_03_SITEMAP.json > /dev/null
          python3 qa/c02_01_source.py A
          python3 qa/c02_02_audits.py A
      - name: Regress all prior C02-01 and C02-02 A/B/C gates after 3/9 advancement
        run: |
          python3 qa/c02_01_source.py B
          python3 qa/c02_01_source.py C
          python3 qa/c02_02_audits.py B
          python3 qa/c02_02_audits.py C
      - name: Audit A — canonical source and allowlisted public route coverage
        run: python3 qa/c02_03_audits.py A
      - name: Audit B — private-path deny boundary and five negative mutations
        run: python3 qa/c02_03_audits.py B
      - name: Restore locked Node 24 and Angular 22 dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Production dependency audit
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Install Chromium for real public route tests
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Angular production build, types and canonical assets
        run: |
          cd frontend
          npm run check:types
          npm run build
          npm run test:assets
      - name: Browser E2E public allowlist, private negatives, identity and WCAG
        run: |
          cd frontend
          npx playwright test tests/c02-03.public-information.spec.ts --reporter=line
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile existing ASP.NET Core 10 Release API
        run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
      - name: Audit C — lazy routing, responsive UX, accessibility and sequence
        run: python3 qa/c02_03_audits.py C
      - name: Save failure screenshots only when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C02-03-public-ia-failure
          path: frontend/test-results/
          retention-days: 3
          if-no-files-found: ignore
