name: CRECISOL C05-06 one-time password recovery A-B-C real NET10 HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PasswordRecoveryContracts.cs'
      - 'backend/src/Crecisol.CredentialSecurity/PasswordRecoveryCrypto.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposablePasswordRecoveryLedger.cs'
      - 'backend/tests/Crecisol.PasswordRecovery.MySqlTests/**'
      - 'database/tests/fixtures/c05_06_disposable_recovery.sql'
      - 'database/tests/c05_06_recovery_http_mysql.sh'
      - 'docs/c05/C05_06_ESPECIFICACION.md'
      - 'qa/c05_06_recovery_audits.py'
      - '.github/workflows/c05-06-recovery.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PasswordRecoveryContracts.cs'
      - 'backend/src/Crecisol.CredentialSecurity/PasswordRecoveryCrypto.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposablePasswordRecoveryLedger.cs'
      - 'backend/tests/Crecisol.PasswordRecovery.MySqlTests/**'
      - 'database/tests/fixtures/c05_06_disposable_recovery.sql'
      - 'database/tests/c05_06_recovery_http_mysql.sh'
      - 'docs/c05/C05_06_ESPECIFICACION.md'
      - 'qa/c05_06_recovery_audits.py'
      - '.github/workflows/c05-06-recovery.yml'
permissions:
  contents: read
jobs:
  one-time-recovery:
    name: Actual MySQL8.4 + .NET10 HTTP one-use Argon2id recovery security
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout immutable SHA and PR ancestry read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word and C05-05 certified prerequisite
        run: |
          set -euo pipefail
          test ! -e .c05-06-proof
          python3 -m py_compile qa/c05_06_recovery_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_06_recovery_audits.py A
          mkdir -p .c05-06-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/A
      - name: Audit B hostile token, HMAC, anti-enumeration, host and SQL CAS mutation cases
        run: |
          set -euo pipefail
          python3 qa/c05_06_recovery_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/B
      - name: Install real .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile real C05-06 HTTP/MySQL integration and public API with warnings as errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/build
      - name: Real MySQL 8.4 one-use expiry and 16-way HTTP reset CAS with global session revocation
        run: |
          set -euo pipefail
          bash database/tests/c05_06_recovery_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/mysql
      - name: Regress C05-01/02/03/04 and real C05-05 HTTP/MySQL8.4 session tests
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/regressions
      - name: Audit C immutable same-run A/B/NET10/MySQL/regressions and exact diff
        run: |
          set -euo pipefail
          python3 qa/c05_06_recovery_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-06-proof/C
      - name: Enforce A B C and real tests same SHA and run (no production rights)
        run: |
          set -euo pipefail
          for stage in A B C build mysql regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-06-proof/$stage"
          done
          echo 'PASS C05-06 ONLY disposable one-time recovery, not real mail or production users'
