name: CRECISOL C05-08 institutional test-only MFA ratification A-B-C real HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_08_2026_11_14.md'
      - 'qa/c05_08_closure_gate.py'
      - '.github/workflows/c05-08-certification.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/ACTA_CERTIFICACION_ACOTADA_C05_08_2026_11_14.md'
      - 'qa/c05_08_closure_gate.py'
      - '.github/workflows/c05-08-certification.yml'
permissions:
  contents: read
jobs:
  institutional-mfa-proof:
    name: Word A-B-C plus genuine .NET10 HTTP MySQL8.4 MFA and C05 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact immutable PR merge or dev SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word, C05-07 and approved technical scope
        run: |
          set -euo pipefail
          test ! -e .c05-08-institutional-proof
          python3 -m py_compile qa/c05_08_closure_gate.py
          python3 qa/validate_foundation.py
          python3 qa/c05_08_closure_gate.py A
          mkdir -p .c05-08-institutional-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/A
      - name: Audit B independent hostile documentary and security guard mutations
        run: |
          set -euo pipefail
          python3 qa/c05_08_closure_gate.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/B
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile product API and isolated MFA crypto plus HTTP/MySQL tests with warnings errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.MfaRisk.MySqlTests/Crecisol.MfaRisk.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/build
      - name: Real RFC6238 HMAC SHA256 and WebAuthn ES256 cryptographic assertions
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj
          printf 'PASS crypto sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/crypto
      - name: Real .NET10 HTTP plus disposable MySQL8.4 MFA enrollment and recovery 16-way CAS
        run: |
          set -euo pipefail
          bash database/tests/c05_08_mfa_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/mysql
      - name: Regressions C05-01 to C05-07 with real MySQL8.4 HTTP tests
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.MailboxApproval.MySqlTests/Crecisol.MailboxApproval.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_07_mailbox_http_mysql.sh
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_06_recovery_http_mysql.sh
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/regressions
      - name: Audit C exact doc-only 3 file scope and genuine same-run evidence
        run: |
          set -euo pipefail
          python3 qa/c05_08_closure_gate.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-institutional-proof/C
      - name: Prove 7 stage artifacts same SHA/run and TEST-only scope
        run: |
          set -euo pipefail
          for stage in A B C build crypto mysql regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-08-institutional-proof/$stage"
          done
          echo 'PASS ONLY C05-08 synthetic MFA isolated; no product passkeys, real identities or authorization'
