name: CRECISOL C03-04 Infrastructure read-only revision A-B-C MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Infrastructure/**'
      - 'backend/tests/Crecisol.Infrastructure.ContractsTests/**'
      - 'database/tests/c03_04_revision_reader_smoke.sh'
      - 'docs/c03/C03_04_ESPECIFICACION.md'
      - 'docs/c03/C03_04_ACTA_MICROFASE.md'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - 'docs/PLAN_MICROFASES_37_CAPITULOS_PROPUESTO.md'
      - 'docs/planificacion-futura/C03_MICROFASES_PROPUESTAS.md'
      - 'docs/MASTER_REFERENCE.md'
      - 'docs/DECISIONES_ABIERTAS.md'
      - 'AGENTS.md'
      - 'qa/c03_04_infrastructure_audits.py'
      - 'qa/c03_04_closure_gate.py'
      - 'qa/c03_03_closure_gate.py'
      - 'qa/c03_02_closure_gate.py'
      - 'qa/c03_01_closure_gate.py'
      - 'qa/c03_01_source.py'
      - 'qa/c02_certification_gate.py'
      - '.github/workflows/c03-04-infrastructure.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Infrastructure/**'
      - 'backend/tests/Crecisol.Infrastructure.ContractsTests/**'
      - 'database/tests/c03_04_revision_reader_smoke.sh'
      - 'docs/c03/C03_04_ESPECIFICACION.md'
      - 'docs/c03/C03_04_ACTA_MICROFASE.md'
      - 'docs/C03_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - 'docs/PLAN_MICROFASES_37_CAPITULOS_PROPUESTO.md'
      - 'docs/planificacion-futura/C03_MICROFASES_PROPUESTAS.md'
      - 'docs/MASTER_REFERENCE.md'
      - 'docs/DECISIONES_ABIERTAS.md'
      - 'AGENTS.md'
      - 'qa/c03_04_infrastructure_audits.py'
      - 'qa/c03_04_closure_gate.py'
      - 'qa/c03_03_closure_gate.py'
      - 'qa/c03_02_closure_gate.py'
      - 'qa/c03_01_closure_gate.py'
      - 'qa/c03_01_source.py'
      - 'qa/c02_certification_gate.py'
      - '.github/workflows/c03-04-infrastructure.yml'
permissions:
  contents: read
jobs:
  c03-04-infrastructure:
    if: startsWith(github.head_ref, 'feature/c03-04-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout CRECISOL without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A canonical Word T01-R04 and original sequence
        run: |
          python3 -m py_compile qa/c03_04_infrastructure_audits.py qa/c03_04_closure_gate.py qa/c03_03_closure_gate.py qa/c03_02_closure_gate.py qa/c03_01_closure_gate.py qa/c03_01_source.py qa/c02_certification_gate.py
          python3 qa/c03_04_infrastructure_audits.py A
      - name: Audit B read-only dependency boundaries and ten negative mutations
        run: python3 qa/c03_04_infrastructure_audits.py B
      - name: Install real .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build public API and new Infrastructure executable in Release
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.Infrastructure.ContractsTests/Crecisol.Infrastructure.ContractsTests.csproj -c Release --nologo
          mkdir -p .c03-04-ci-proof
          printf 'PASS: build\n' > .c03-04-ci-proof/build
      - name: Run typed Infrastructure port and fail-closed contract tests
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.Infrastructure.ContractsTests/Crecisol.Infrastructure.ContractsTests.csproj -- contracts
          printf 'PASS: contract\n' > .c03-04-ci-proof/contract
      - name: Run real isolated MySQL 8.4 revision adapter and negative SQL grants
        run: |
          bash -n database/tests/c03_04_revision_reader_smoke.sh
          bash database/tests/c03_04_revision_reader_smoke.sh
          printf 'PASS: mysql\n' > .c03-04-ci-proof/mysql
      - name: Regression C03-03 Application port contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Application.ContractsTests/Crecisol.Application.ContractsTests.csproj
          printf 'PASS: c03-app\n' > .c03-04-ci-proof/c03-app
      - name: Regression C01 Application port contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ApplicationTests/Crecisol.Branding.ApplicationTests.csproj
          printf 'PASS: c01-app\n' > .c03-04-ci-proof/c01-app
      - name: Regression C03-02 Domain contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj
          printf 'PASS: c03-domain\n' > .c03-04-ci-proof/c03-domain
      - name: Regression C01 Domain contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ContractsTests/Crecisol.Branding.ContractsTests.csproj
          printf 'PASS: c01-domain\n' > .c03-04-ci-proof/c01-domain
      - name: Audit C real .NET10 + MySQL + typed regressions and architecture
        run: python3 qa/c03_04_infrastructure_audits.py C
      - name: Gate C03-04 acta, limited later approval and twelve negative mutations
        run: python3 qa/c03_04_closure_gate.py
