name: CRECISOL C05-01 preparacion identidad A-B-C Word
on:
  pull_request:
    branches: [dev]
    paths:
      - 'qa/c05_01_preparation_audits.py'
      - '.github/workflows/c05-01-preparation.yml'
      - 'docs/C05_PREPARACION.md'
      - 'docs/c05/C05_01_*'
  push:
    branches: [dev]
    paths:
      - 'qa/c05_01_preparation_audits.py'
      - '.github/workflows/c05-01-preparation.yml'
      - 'docs/C05_PREPARACION.md'
      - 'docs/c05/C05_01_*'
permissions:
  contents: read
jobs:
  c05-01-preparation:
    name: C05-01 source and A-B-C preparation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout read-only without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit A exact canonical Word/PDF SHA and chapter 05 requirements
        run: |
          test ! -e .c05-01-prep-proof
          python3 -m py_compile qa/c05_01_preparation_audits.py
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c05_01_preparation_audits.py source
          python3 qa/c05_01_preparation_audits.py A
          mkdir -p .c05-01-prep-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-01-prep-proof/A
      - name: Audit B adversarial documentation mutations and no private API
        run: |
          python3 qa/c05_01_preparation_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-01-prep-proof/B
      - name: Audit C same SHA/run evidence and docs-only boundaries
        run: python3 qa/c05_01_preparation_audits.py C
