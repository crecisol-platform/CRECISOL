name: CRECISOL C05-07 verified mailbox and sensitive changes A-B-C HTTP MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/SensitiveMailboxVerification.cs'
      - 'backend/src/Crecisol.CredentialSecurity/MailboxApprovalTokenProtector.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableSensitiveMailboxLedger.cs'
      - 'backend/tests/Crecisol.MailboxApproval.MySqlTests/**'
      - 'database/tests/fixtures/c05_07_disposable_mailbox.sql'
      - 'database/tests/c05_07_mailbox_http_mysql.sh'
      - 'docs/c05/C05_07_ESPECIFICACION.md'
      - 'qa/c05_07_mailbox_audits.py'
      - '.github/workflows/c05-07-mailbox.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/SensitiveMailboxVerification.cs'
      - 'backend/src/Crecisol.CredentialSecurity/MailboxApprovalTokenProtector.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableSensitiveMailboxLedger.cs'
      - 'backend/tests/Crecisol.MailboxApproval.MySqlTests/**'
      - 'database/tests/fixtures/c05_07_disposable_mailbox.sql'
      - 'database/tests/c05_07_mailbox_http_mysql.sh'
      - 'docs/c05/C05_07_ESPECIFICACION.md'
      - 'qa/c05_07_mailbox_audits.py'
      - '.github/workflows/c05-07-mailbox.yml'
permissions:
  contents: read
jobs:
  verified-mailbox:
    name: Real HTTP/NET10 MySQL8.4 two-mail approval and source/QA A-B-C
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted immutable PR merge or dev SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word C05-06 and C05-07 functional specification
        run: |
          set -euo pipefail
          test ! -e .c05-07-proof
          python3 -m py_compile qa/c05_07_mailbox_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_07_mailbox_audits.py A
          mkdir -p .c05-07-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/A
      - name: Audit B negative mutation adversaries for reauth and one-use dual approval
        run: |
          set -euo pipefail
          python3 qa/c05_07_mailbox_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/B
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile product API and test-only mailbox HTTP with warnings as errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.MailboxApproval.MySqlTests/Crecisol.MailboxApproval.MySqlTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/build
      - name: REAL MySQL8.4 disposable + HTTP Argon2id reauth, double mail confirmation and 16-way CAS
        run: |
          set -euo pipefail
          bash database/tests/c05_07_mailbox_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/mysql
      - name: Regression C05-01..04, C05-05 HTTP sessions, and C05-06 HTTP one-time recovery
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_06_recovery_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/regressions
      - name: Audit C exact SHA/repository/diff and same-run real SQL HTTP proof
        run: |
          set -euo pipefail
          python3 qa/c05_07_mailbox_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-07-proof/C
      - name: Require all proof files A B C build MySQL real predecessor on the same SHA
        run: |
          set -euo pipefail
          for stage in A B C build mysql regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-07-proof/$stage"
          done
          echo 'PASS C05-07 isolated dual-mailbox authentication ONLY; no product email/login'
