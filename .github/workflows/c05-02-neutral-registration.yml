name: CRECISOL C05-02 neutral registration real HTTP/MySQL8.4 A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/RequestNeutralRegistrationIntent.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableNeutralRegistrationRecorder.cs'
      - 'backend/tests/Crecisol.NeutralRegistration.IntegrationTests/**'
      - 'database/tests/fixtures/c05_02_neutral_registration_fixture.sql'
      - 'database/tests/c05_02_neutral_registration_http_mysql.sh'
      - 'docs/c05/C05_REGISTRO_NEUTRAL_HTTP_MYSQL.md'
      - 'qa/c05_02_neutral_ingress_audits.py'
      - '.github/workflows/c05-02-neutral-registration.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/RequestNeutralRegistrationIntent.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableNeutralRegistrationRecorder.cs'
      - 'backend/tests/Crecisol.NeutralRegistration.IntegrationTests/**'
      - 'database/tests/fixtures/c05_02_neutral_registration_fixture.sql'
      - 'database/tests/c05_02_neutral_registration_http_mysql.sh'
      - 'docs/c05/C05_REGISTRO_NEUTRAL_HTTP_MYSQL.md'
      - 'qa/c05_02_neutral_ingress_audits.py'
      - '.github/workflows/c05-02-neutral-registration.yml'
permissions:
  contents: read
jobs:
  c05-02-neutral-registration:
    name: Real Kestrel HTTP MySQL8.4 neutral privacy/A-B-C SHA-gated
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact SHA with both parents and no persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word/PDF, C05 scope and neutral ingress source
        run: |
          set -euo pipefail
          test ! -e .c05-02-neutral-proof
          python3 -m py_compile qa/c05_02_neutral_ingress_audits.py
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c05_01_preparation_audits.py source
          python3 qa/c05_02_neutral_ingress_audits.py A
          mkdir -p .c05-02-neutral-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-neutral-proof/A
      - name: Audit B code/SQL privacy, no enumeration and hostile mutations
        run: |
          set -euo pipefail
          python3 qa/c05_02_neutral_ingress_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-neutral-proof/B
      - name: Setup .NET 10 SDK pinned
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile prod API and real HTTP integration in Release with warnings as errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.NeutralRegistration.IntegrationTests/Crecisol.NeutralRegistration.IntegrationTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj
          printf 'PASS dotnet sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-neutral-proof/dotnet
      - name: REAL Kestrel loopback HTTP plus MySQL 8.4 cryptographic and abuse tests
        run: |
          set -euo pipefail
          bash database/tests/c05_02_neutral_registration_http_mysql.sh
          printf 'PASS mysql_http sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-neutral-proof/mysql_http
      - name: Audit C exact SHA/run, backend boundaries, scope and real proofs
        run: |
          set -euo pipefail
          python3 qa/c05_02_neutral_ingress_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-neutral-proof/C
      - name: Same-run A/B/C and real .NET10 HTTP MySQL gate
        run: |
          set -euo pipefail
          for stage in A B C dotnet mysql_http; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-02-neutral-proof/$stage"
          done
          echo "PASS C05-02 NEUTRAL INTENT ONLY at SHA=$GITHUB_SHA run=$GITHUB_RUN_ID"
          echo "NO certification of real email verification, sender, identity signup or tenant membership"
