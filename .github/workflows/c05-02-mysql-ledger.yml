name: CRECISOL C05-02 MySQL8.4 real .NET10 ledger A-B-C (isolated only)
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Identity/InvitationSecurityContracts.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableInvitationLedger.cs'
      - 'backend/tests/Crecisol.InvitationSecurity.MySqlIntegrationTests/**'
      - 'database/tests/c05_02_dotnet_mysql_adapter_smoke.sh'
      - 'docs/c05/IMPLEMENTACION_C05_02_MYSQL_ADAPTER.md'
      - 'qa/c05_02_invitations_audits.py'
      - 'qa/c05_02_mysql_adapter_audits.py'
      - '.github/workflows/c05-02-mysql-ledger.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Identity/InvitationSecurityContracts.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlDisposableInvitationLedger.cs'
      - 'backend/tests/Crecisol.InvitationSecurity.MySqlIntegrationTests/**'
      - 'database/tests/c05_02_dotnet_mysql_adapter_smoke.sh'
      - 'docs/c05/IMPLEMENTACION_C05_02_MYSQL_ADAPTER.md'
      - 'qa/c05_02_invitations_audits.py'
      - 'qa/c05_02_mysql_adapter_audits.py'
      - '.github/workflows/c05-02-mysql-ledger.yml'
permissions:
  contents: read
jobs:
  c05-02-mysql-ledger:
    name: Actual .NET10 MySqlConnector <-> loopback MySQL8.4 ledger, A/B/C strict
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact immutable source with PR parents and no stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A master authority and exact typed storage boundary
        run: |
          set -euo pipefail
          test ! -e .c05-02-adapter-proof
          python3 -m py_compile qa/c05_02_mysql_adapter_audits.py
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c05_02_mysql_adapter_audits.py A
          mkdir -p .c05-02-adapter-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-adapter-proof/A
      - name: Audit B 65-plus fail-closed code, secrets and tenant SQL mutations
        run: |
          set -euo pipefail
          python3 qa/c05_02_mysql_adapter_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-adapter-proof/B
      - name: Setup official .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile complete API and MySqlConnector adapter .NET10 Release warnings-as-errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.InvitationSecurity.MySqlIntegrationTests/Crecisol.InvitationSecurity.MySqlIntegrationTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj
          printf 'PASS dotnet sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-adapter-proof/dotnet
      - name: REAL isolated MySQL 8.4 with .NET10 A/B tenants and 16 competing clients
        run: |
          set -euo pipefail
          bash database/tests/c05_02_dotnet_mysql_adapter_smoke.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-adapter-proof/mysql
      - name: Audit C read-only exact SHA, no production, real A/B and MySQL evidence
        run: |
          set -euo pipefail
          python3 qa/c05_02_mysql_adapter_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-adapter-proof/C
      - name: Final A-B-C and real .NET10+MySQL8.4 same SHA/run gate
        run: |
          set -euo pipefail
          for stage in A B C dotnet mysql; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-02-adapter-proof/$stage"
          done
          echo 'C05-02 isolated MySQL adapter verified; functional registration/email/identity membership NOT CERTIFIED'
