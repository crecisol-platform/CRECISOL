name: CRECISOL C05 F05 premium secure modal revalidation
on:
  push:
    branches: [feature/c05-ux-f05-premium-9p5-20261123]
    paths:
      - 'frontend/src/app/ui/institutional-modal/**'
      - 'frontend/tests/c05-f05-secure-modals.spec.ts'
      - 'qa/c05_ux_f05_modal_audits.py'
      - 'docs/c05/ux/F05_PREMIUM_95_AUDITORIAS_2026_11_23.md'
      - '.github/workflows/c05-ux-f05-premium-9p5.yml'
permissions:
  contents: read
concurrency:
  group: c05-f05-premium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  premium-modal-browser:
    name: F05 A-B-C Angular Chromium and 65-interface regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout verified candidate ancestry without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Strict F05-only scope and independent A-B-C audits
        shell: bash
        run: |
          set -euo pipefail
          BASE=1d8a8e552b6eb7749d81aafaaa1e5201163b6c4e
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r path; do
            case "$path" in
              frontend/src/app/ui/institutional-modal/institutional-modal.component.ts|frontend/src/app/ui/institutional-modal/institutional-modal.component.html|frontend/src/app/ui/institutional-modal/institutional-modal.component.css|frontend/tests/c05-f05-secure-modals.spec.ts|qa/c05_ux_f05_modal_audits.py|docs/c05/ux/F05_PREMIUM_95_AUDITORIAS_2026_11_23.md|.github/workflows/c05-ux-f05-premium-9p5.yml) ;;
              *) echo "F05 PREMIUM OUT OF SCOPE: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          for gate in A B C; do
            python3 qa/c05_ux_f05_modal_audits.py "$gate"
          done
      - name: Node 24.15.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Locked Angular 22 dependencies, TypeScript and production builds
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx ng build --configuration institutional-harness
      - name: Install pinned Chromium browser
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd frontend
          timeout 300s npx playwright install chromium
      - name: F05 secure modals 11 scenarios x 5 widths, security and accessibility
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f05-modals.config.ts --reporter=line
      - name: Verify all 55 individual F05 PNG and JSON files against exact SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/c05_ux_f05_modal_evidence.py frontend/test-results-f05-modals
      - name: F04 five-operator premium UI regression
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f04-operators.config.ts --reporter=line
      - name: F03 authenticated account and navigation regression
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f03-account.config.ts --reporter=line
          npx playwright test --config=playwright.c05-f03.config.ts --reporter=line
      - name: F02 institutional design system regression
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.institutional.config.ts --reporter=line
      - name: F06 contextual feedback and states regression
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f06-feedback.config.ts --reporter=line
      - name: F01 through F06 inventory 65 IDs x five viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f06-inventory65.config.ts --reporter=line
          cd ..
          python3 qa/c05_ux_f06_65_coverage.py \
            frontend/test-results-f06-inventory65 \
            docs/c05/ux/F06_65_SUPERFICIES_VALORACION.csv
      - name: Retain individual PNG, JSON and all failed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c05-f05-premium-browser-${{ github.sha }}
          path: |
            frontend/test-results-f05-modals/
            frontend/test-results-f04-operators/
            frontend/test-results-f03-account/
            frontend/test-results-f03/
            frontend/test-results-institutional/
            frontend/test-results-f06-feedback/
            frontend/test-results-f06-inventory65/
          retention-days: 21
          if-no-files-found: warn
  real-identity-backend:
    name: F05 real Angular NET10 MySQL8.4 tenant/MFA/session negative E2E
    needs: premium-modal-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact F05 premium SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node 24.15.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile API, local provisioner and synthetic SMTP
        shell: bash
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tools/Crecisol.LocalIdentityProvisioner/Crecisol.LocalIdentityProvisioner.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release --nologo -warnaserror
      - name: Locked Angular dependencies and Chromium
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          cd frontend
          timeout 420s npx playwright install chromium
      - name: Disposable MySQL8.4 and negative Angular NET10 end-to-end
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          node qa/c05_operational_flow_e2e.mjs
