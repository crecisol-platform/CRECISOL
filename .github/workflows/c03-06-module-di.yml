name: CRECISOL C03-06 explicit Branding DI A-B-C MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/**'
      - 'backend/tests/Crecisol.Api.ModuleTests/**'
      - 'qa/c03_06_*'
      - 'docs/c03/C03_06_*'
      - '.github/workflows/c03-06-module-di.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/**'
      - 'backend/tests/Crecisol.Api.ModuleTests/**'
      - 'qa/c03_06_*'
      - 'docs/c03/C03_06_*'
      - '.github/workflows/c03-06-module-di.yml'
permissions:
  contents: read
jobs:
  c03-06-explicit-di:
    if: startsWith(github.head_ref, 'feature/c03-06-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CRECISOL read-only without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Canonical Word, T01-R03/R04/R05 and explicit module audit A
        run: |
          python3 -m py_compile qa/c03_06_module_audits.py
          python3 qa/c03_06_module_audits.py A
      - name: Security no Service Locator and fifteen adversarial mutations audit B
        run: python3 qa/c03_06_module_audits.py B
      - name: Install .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile public API and DI contract tests .NET10 Release warnings-as-errors
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.Api.ModuleTests/Crecisol.Api.ModuleTests.csproj -c Release --nologo
          mkdir -p .c03-06-ci-proof
          printf 'PASS: build\n' > .c03-06-ci-proof/build
      - name: Execute public module lifetimes, duplicate and private-port negatives
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.Api.ModuleTests/Crecisol.Api.ModuleTests.csproj
          printf 'PASS: module-tests\n' > .c03-06-ci-proof/module-tests
      - name: Regress all C01-C03 Domain, Application, Infrastructure, DTO contracts
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ContractsTests/Crecisol.Branding.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ApplicationTests/Crecisol.Branding.ApplicationTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Application.ContractsTests/Crecisol.Application.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Infrastructure.ContractsTests/Crecisol.Infrastructure.ContractsTests.csproj -- contracts
          dotnet run -c Release --project backend/tests/Crecisol.Api.ContractsTests/Crecisol.Api.ContractsTests.csproj
          printf 'PASS: regressions\n' > .c03-06-ci-proof/regressions
      - name: Real isolated MySQL8.4 read-only and 27 additional HTTP DTO cases
        run: |
          CRECISOL_C03_05_CONTRACT_SMOKE=1 bash database/tests/c01_04_api_mysql_smoke.sh
          printf 'PASS: mysql-http\n' > .c03-06-ci-proof/mysql-http
      - name: Audit C architecture and real same-job execution evidence
        run: python3 qa/c03_06_module_audits.py C
