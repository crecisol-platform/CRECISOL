name: CRECISOL C06-07 privacy minimization five audits A-B-C-D-E
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/Modules/Identity/OperationalIdentityModule.cs'
      - 'backend/src/Crecisol.Api/Program.cs'
      - 'backend/src/Crecisol.Api/Contracts/C06IdentityResponseProjection.cs'
      - 'backend/tests/Crecisol.C06Privacy.ContractsTests/Program.cs'
      - 'backend/tests/Crecisol.C06Privacy.ContractsTests/Crecisol.C06Privacy.ContractsTests.csproj'
      - 'docs/c06/C06_07_CONTRATOS_RESPUESTA.json'
      - 'database/migrations/022_c06_privacy_disposition.sql'
      - 'database/migrations/022_c06_privacy_disposition.down.sql'
      - 'database/operations/c06_07_local_privacy_worker.sql'
      - 'database/tests/c06_07_privacy_mysql.sh'
      - 'qa/c06_07_privacy_response_checks.mjs'
      - 'qa/c06_07_privacy_oracle_tests.mjs'
      - 'qa/c06_07_privacy_relay.mjs'
      - 'qa/c06_07_privacy_relay_tests.mjs'
      - 'qa/c05_operational_flow_e2e.mjs'
      - 'docs/c06/C06_07_ESPECIFICACION.md'
      - 'qa/c06_07_privacy_scope.py'
      - 'qa/c06_07_privacy_audits.py'
      - '.github/workflows/c06-07-privacy-minimization.yml'
      - 'qa/c06_06_exceptional_scope.py'
      - 'qa/c06_02_role_model_audit.py'
      - 'qa/c06_03_context_audits.py'
      - 'qa/c06_04_abac_audits.py'
      - 'qa/c06_05_stepup_audits.py'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/Modules/Identity/OperationalIdentityModule.cs'
      - 'backend/src/Crecisol.Api/Program.cs'
      - 'backend/src/Crecisol.Api/Contracts/C06IdentityResponseProjection.cs'
      - 'backend/tests/Crecisol.C06Privacy.ContractsTests/Program.cs'
      - 'backend/tests/Crecisol.C06Privacy.ContractsTests/Crecisol.C06Privacy.ContractsTests.csproj'
      - 'docs/c06/C06_07_CONTRATOS_RESPUESTA.json'
      - 'database/migrations/022_c06_privacy_disposition.sql'
      - 'database/migrations/022_c06_privacy_disposition.down.sql'
      - 'database/operations/c06_07_local_privacy_worker.sql'
      - 'database/tests/c06_07_privacy_mysql.sh'
      - 'qa/c06_07_privacy_response_checks.mjs'
      - 'qa/c06_07_privacy_oracle_tests.mjs'
      - 'qa/c06_07_privacy_relay.mjs'
      - 'qa/c06_07_privacy_relay_tests.mjs'
      - 'qa/c05_operational_flow_e2e.mjs'
      - 'docs/c06/C06_07_ESPECIFICACION.md'
      - 'qa/c06_07_privacy_scope.py'
      - 'qa/c06_07_privacy_audits.py'
      - '.github/workflows/c06-07-privacy-minimization.yml'
      - 'qa/c06_06_exceptional_scope.py'
      - 'qa/c06_02_role_model_audit.py'
      - 'qa/c06_03_context_audits.py'
      - 'qa/c06_04_abac_audits.py'
      - 'qa/c06_05_stepup_audits.py'
permissions:
  contents: read
jobs:
  a-source:
    name: A | Approved Word, catalog overlay and exact scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/master_source_guard.py
      - run: python3 qa/c06_01_permissions_catalog_audit.py A
      - run: python3 qa/c06_07_privacy_audits.py A
  b-security:
    name: B | Response field minimization and adversarial contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_07_privacy_audits.py B
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/tests/Crecisol.C06Privacy.ContractsTests/Crecisol.C06Privacy.ContractsTests.csproj -c Release -warnaserror
      - run: dotnet run --no-build -c Release --project backend/tests/Crecisol.C06Privacy.ContractsTests/Crecisol.C06Privacy.ContractsTests.csproj
  c-architecture:
    name: C | Domain separation and .NET 10 Angular 22 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_07_privacy_audits.py C
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: |
          node --check qa/c05_operational_flow_e2e.mjs
          node --check qa/c06_07_privacy_response_checks.mjs
          node --check qa/c06_07_privacy_relay.mjs
          node --test qa/c06_07_privacy_oracle_tests.mjs qa/c06_07_privacy_relay_tests.mjs
      - name: Angular 22 unchanged functional/regression compile
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
  d-persistence:
    name: D | Real MySQL 8.4 retention, disposition and worker privileges
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_07_privacy_audits.py D
      - run: bash -n database/tests/c06_07_privacy_mysql.sh
      - run: bash database/tests/c06_07_privacy_mysql.sh
  e-e2e:
    name: "E | E2E Chromium Angular Kestrel MySQL: strict privacy responses and full regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile real API, local SMTP receiver and test-only provisioner
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release -warnaserror
          dotnet build backend/tools/Crecisol.LocalIdentityProvisioner/Crecisol.LocalIdentityProvisioner.csproj -c Release -warnaserror
      - name: Angular + Chromium test runner
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Real wire privacy and previous security regressions
        run: node qa/c05_operational_flow_e2e.mjs --c06-04 --c06-05 --c06-06 --c06-07
