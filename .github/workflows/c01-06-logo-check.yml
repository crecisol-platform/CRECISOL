name: CRECISOL C01-06 approved brand integration gate
on:
  pull_request:
    branches: [dev]
    paths:
      - 'qa/c01_06_logo_candidate.py'
      - 'docs/c01/C01_06_LOGO_CANDIDATO.md'
      - '.github/workflows/c01-06-logo-check.yml'
      - 'frontend/tests/c01-06.logo-candidate.spec.ts'
      - 'frontend/tests/c01-06.platform-logo-preview.spec.ts'
      - 'frontend/src/app/pages/platform-home.component.ts'
      - 'frontend/src/app/pages/platform-home.component.html'
      - 'frontend/src/app/pages/platform-home.component.css'
      - 'frontend/src/index.html'
      - 'frontend/package.json'
      - 'frontend/tests/c01-05.public-brand.spec.ts'
      - 'frontend/tests/c01-06.official-integration.spec.ts'
      - 'qa/c01_06_official_assets.py'
      - 'qa/c01_06_final_audits.py'
      - '.gitignore'
permissions:
  contents: read
jobs:
  candidate:
    name: C01-06 canonical extraction and preliminary security checks
    if: startsWith(github.head_ref, 'feature/c01-06-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract exact unapproved candidate to disposable runner
        run: python3 qa/c01_06_logo_candidate.py --extract-dir /tmp/c01-06-candidate
      - name: Execute positive and adversarial negative tests
        run: python3 qa/c01_06_logo_candidate.py --tests
      - name: Preliminary audit A
        run: python3 qa/c01_06_logo_candidate.py --audit A
      - name: Preliminary audit B
        run: python3 qa/c01_06_logo_candidate.py --audit B
      - name: Preliminary audit C
        run: python3 qa/c01_06_logo_candidate.py --audit C
      - name: Upload private candidate for human comparison (NOT APPROVED)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C01-06-candidate-NOT-APPROVED
          path: /tmp/c01-06-candidate/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  c01-06-browser-isolated:
    name: C01-06 integrated Angular logo header, regression and final A B C audits
    if: startsWith(github.head_ref, 'feature/c01-06-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract verified candidate only to disposable runner
        run: python3 qa/c01_06_logo_candidate.py --extract-dir /tmp/c01-06-candidate
      - name: Install pinned Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked frontend dependencies without lifecycle scripts
        run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Install Chromium on temporary runner
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Generate exact approved assets and typecheck+compile real Angular app
        run: |
          cd frontend
          npm run check:types
          npm run build
          npm run test:assets
      - name: Independently verify the logo in built production output
        run: |
          test -s frontend/dist/crecisol-web/browser/assets/crecisol-oficial.png
          test -s frontend/dist/crecisol-web/browser/assets/crecisol-emblem.png
      - name: Verify extracted file exists
        run: test -s /tmp/c01-06-candidate/crecisol-candidate-NOT-APPROVED.png
      - name: Run isolated responsive, negative and accessibility browser tests
        env:
          C01_06_CANDIDATE: /tmp/c01-06-candidate/crecisol-candidate-NOT-APPROVED.png
        run: |
          cd frontend
          npx playwright test tests/c01-05.public-brand.spec.ts tests/c01-06.logo-candidate.spec.ts tests/c01-06.platform-logo-preview.spec.ts tests/c01-06.official-integration.spec.ts --reporter=line
      - name: FINAL audit A - provenance, owner approval and requirement traceability
        run: python3 qa/c01_06_final_audits.py --audit A
      - name: FINAL audit B - canonical assets and twelve adversarial rejects
        run: python3 qa/c01_06_final_audits.py --audit B
      - name: FINAL audit C - production output, responsive and accessibility evidence
        run: python3 qa/c01_06_final_audits.py --audit C
      - name: Upload approved, independently generated graphic files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C01-06-official-APPROVED-SHA-VERIFIED
          path: |
            frontend/public/assets/crecisol-oficial.png
            frontend/public/assets/crecisol-emblem.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload PRIVATE unapproved review screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C01-06-browser-visual-evidence
          path: |
            frontend/test-results/c01-06-review-NOT-APPROVED-*.png
            frontend/test-results/c01-06-angular-NOT-APPROVED-*.png
            frontend/test-results/C01-06-OFFICIAL-*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
