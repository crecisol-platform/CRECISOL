name: CRECISOL C05 F02 cross-surface visual parity integration
on:
  push:
    branches: [feature/c05-ux-f02-paridad-visual-integracion-20261122]
    paths:
      - 'frontend/src/app/pages/identity-flow.component.css'
      - 'frontend/src/app/pages/platform-operator-f04.component.css'
      - 'frontend/src/app/ui/institutional-modal/institutional-modal.component.css'
      - 'frontend/src/app/ui/feedback/operation-feedback.component.css'
      - 'frontend/tests/c05-f06-context-feedback.spec.ts'
      - 'qa/c05_ux_f02_visual_integration_audits.py'
      - 'docs/c05/ux/F02_PARIDAD_VISUAL_INTEGRACION_2026_11_22.md'
      - '.github/workflows/c05-ux-f02-paridad-visual.yml'
permissions:
  contents: read
concurrency:
  group: c05-f02-parity-${{ github.sha }}
  cancel-in-progress: true
jobs:
  browser-parity:
    name: F02 Angular 22 visual, full 65 x 5, F03-F06 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout isolated exact SHA, no saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Three F02 scope, security and visual-contract audits
        shell: bash
        run: |
          set -euo pipefail
          for gate in A B C; do
            python3 qa/c05_ux_f02_visual_integration_audits.py "$gate"
          done
          for gate in A B C; do
            python3 qa/c05_ux_f02_design_system_audits.py "$gate"
            python3 qa/c05_ux_f05_modal_audits.py "$gate"
          done
      - name: Node 24.15.0 locked
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Locked frontend dependencies and Angular 22 production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx ng build --configuration institutional-harness
      - name: Chromium (isolated synthetic evidence, no real credentials)
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd frontend
          timeout 300s npx playwright install chromium
      - name: F06 semantic feedback, F02 computed colors at five sizes
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f06-feedback.config.ts --reporter=line
      - name: Verify 30 feedback scenes and 70 premium screenshot pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/c05_ux_f06_feedback_evidence.py frontend/test-results-f06-feedback
          python3 qa/c05_ux_f06_premium_evidence.py frontend/test-results-f06-feedback
      - name: Secure modals, operator console, account, F02 laboratory
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f05-modals.config.ts --reporter=line
          npx playwright test --config=playwright.c05-f04-operators.config.ts --reporter=line
          npx playwright test --config=playwright.c05-f03.config.ts --reporter=line
          npx playwright test --config=playwright.c05-f03-account.config.ts --reporter=line
          npx playwright test --config=playwright.institutional.config.ts --reporter=line
          npx playwright test tests/c05-institutional-modals.spec.ts --config=playwright.config.ts --reporter=line
          npx playwright test tests/c05-modal-accessibility-deep.spec.ts --config=playwright.config.ts --reporter=line
      - name: All 65 inventory surfaces at five viewports, no fake SHA
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.c05-f06-inventory65.config.ts --reporter=line
      - name: Fail closed on missing or clipped 65 x 5 visual evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/c05_ux_f06_65_coverage.py \
            frontend/test-results-f06-inventory65 \
            docs/c05/ux/F06_65_SUPERFICIES_VALORACION.csv
      - name: Preserve individual PNG/JSON and trace without hiding failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c05-f02-visual-parity-${{ github.sha }}
          path: |
            frontend/test-results-f06-feedback/
            frontend/test-results-f06-inventory65/
            frontend/test-results-f05-modals/
            frontend/test-results-f04-operators/
            frontend/test-results-f03/
            frontend/test-results-f03-account/
            frontend/test-results-institutional/
            frontend/test-results/
          retention-days: 21
          if-no-files-found: warn
  real-backend-regression:
    name: F02 non-regression real Angular .NET10 MySQL8.4
    needs: browser-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout F02 integration SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Node 24.15.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile API, provisioner and private SMTP fixture
        shell: bash
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tools/Crecisol.LocalIdentityProvisioner/Crecisol.LocalIdentityProvisioner.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release --nologo -warnaserror
      - name: Locked Angular deps and Chromium
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          cd frontend
          timeout 420s npx playwright install chromium
      - name: Disposable MySQL 8.4 + Angular/API identity and multitenant negative E2E
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          node qa/c05_operational_flow_e2e.mjs
