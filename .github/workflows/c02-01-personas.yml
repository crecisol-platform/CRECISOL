name: CRECISOL C02-01 personas canonical source and audits
on:
  pull_request:
    branches: [dev]
    paths:
      - 'qa/c02_01_*'
      - 'docs/c02/C02_01_*'
      - 'docs/C02_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - '.github/workflows/c02-01-personas.yml'
  push:
    branches: [dev]
    paths:
      - 'qa/c02_01_*'
      - 'docs/c02/C02_01_*'
      - 'docs/C02_PREPARACION.md'
      - 'docs/PLAN_37_CAPITULOS.md'
      - '.github/workflows/c02-01-personas.yml'
permissions:
  contents: read
jobs:
  c02-source:
    name: C02-01 canonical personas source, boundary and evidence
    if: startsWith(github.head_ref, 'feature/c02-01-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only CRECISOL checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile canonical extractor
        run: python3 -m py_compile qa/c02_01_source.py
      - name: Read canonical chapter 02, guarded SHA and boundaries
        run: python3 qa/c02_01_source.py --preview
      - name: Audit A — exact source paragraphs, rows and missing-duplicate negatives
        run: python3 qa/c02_01_source.py A
      - name: Audit B — identities, tenant boundaries and adversarial requirements
        run: python3 qa/c02_01_source.py B
      - name: Install Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Restore locked Angular 22 dependencies without scripts
        run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Check production dependency security baseline
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Check Angular types and production build (no source changes)
        run: |
          cd frontend
          npm run check:types
          npm run build
          npm run test:assets
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile ASP.NET Core 10 Release (no backend changes)
        run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
      - name: Audit C — architecture, six experiences and UX/sequence gates
        run: python3 qa/c02_01_source.py C
