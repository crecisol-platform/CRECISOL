name: CRECISOL C05-08 crypto subgate RFC6238 WebAuthn ES256 A-B-C (not certification)
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/C05_08_ESPECIFICACION.md'
      - 'backend/src/Crecisol.CredentialSecurity/TotpSha256Verifier.cs'
      - 'backend/src/Crecisol.CredentialSecurity/SyntheticWebAuthnEs256Verifier.cs'
      - 'backend/src/Crecisol.CredentialSecurity/MfaRecoveryCodeProtector.cs'
      - 'backend/tests/Crecisol.MfaRisk.ContractsTests/**'
      - 'qa/c05_08_mfa_crypto_audits.py'
      - '.github/workflows/c05-08-mfa-crypto.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/C05_08_ESPECIFICACION.md'
      - 'backend/src/Crecisol.CredentialSecurity/TotpSha256Verifier.cs'
      - 'backend/src/Crecisol.CredentialSecurity/SyntheticWebAuthnEs256Verifier.cs'
      - 'backend/src/Crecisol.CredentialSecurity/MfaRecoveryCodeProtector.cs'
      - 'backend/tests/Crecisol.MfaRisk.ContractsTests/**'
      - 'qa/c05_08_mfa_crypto_audits.py'
      - '.github/workflows/c05-08-mfa-crypto.yml'
permissions:
  contents: read
jobs:
  mfa-crypto-subgate:
    name: Real .NET 10 TOTP/ES256 proof + negative 16-way memory CAS; NOT MFA certified
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout exact immutable SHA read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A Word canonical, C05-07 and crypto-only limits
        run: |
          set -euo pipefail
          test ! -e .c05-08-crypto-proof
          python3 -m py_compile qa/c05_08_mfa_crypto_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_08_mfa_crypto_audits.py A
          mkdir -p .c05-08-crypto-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/A
      - name: Audit B reject fake MFA, replay, wrong origin, reset bypass markers
        run: |
          set -euo pipefail
          python3 qa/c05_08_mfa_crypto_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/B
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile public API, credential security and isolated crypto harness with warnings errors
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj -c Release --nologo -warnaserror
          printf 'PASS build sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/build
      - name: Execute genuine HMAC-SHA256 RFC6238 and ES256 signed WebAuthn cryptographic negatives
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project backend/tests/Crecisol.MfaRisk.ContractsTests/Crecisol.MfaRisk.ContractsTests.csproj
          printf 'PASS crypto sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/crypto
      - name: Previous C05-01..07 regressions including REAL HTTP MySQL8.4 mailbox, sessions and recovery
        run: |
          set -euo pipefail
          for proj in \
            backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj \
            backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj \
            backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj \
            backend/tests/Crecisol.ContextualLogin.ContractsTests/Crecisol.ContextualLogin.ContractsTests.csproj; do
            dotnet build "$proj" -c Release --nologo -warnaserror
            dotnet run --no-build -c Release --project "$proj"
          done
          dotnet build backend/tests/Crecisol.MailboxApproval.MySqlTests/Crecisol.MailboxApproval.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_07_mailbox_http_mysql.sh
          dotnet build backend/tests/Crecisol.PasswordRecovery.MySqlTests/Crecisol.PasswordRecovery.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_06_recovery_http_mysql.sh
          dotnet build backend/tests/Crecisol.SessionRevocation.MySqlTests/Crecisol.SessionRevocation.MySqlTests.csproj -c Release --nologo -warnaserror
          bash database/tests/c05_05_session_http_mysql.sh
          printf 'PASS regressions sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/regressions
      - name: Audit C immutable same-SHA A/B/NET10/crypto/regression + exact diff
        run: |
          set -euo pipefail
          python3 qa/c05_08_mfa_crypto_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-08-crypto-proof/C
      - name: Enforce same-run proof and STOP at crypto subgate, no production entitlement
        run: |
          set -euo pipefail
          for stage in A B C build crypto regressions; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-08-crypto-proof/$stage"
          done
          echo 'PASS ONLY C05-08 CRYPTO subgate: no durable enrollment, WebAuthn attestation, factor reset or product access'
