name: CRECISOL C06-05 sensitive operation step-up A-B-C-E2E
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Authorization/C06SensitiveOperationPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Authorized.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Platform.cs'
      - 'backend/tests/Crecisol.C06StepUp.ContractsTests/**'
      - 'docs/c06/C06_05_ESPECIFICACION.md'
      - 'qa/c06_05_stepup_audits.py'
      - 'qa/c05_operational_flow_e2e.mjs'
      - '.github/workflows/c06-05-sensitive-step-up.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Authorization/C06SensitiveOperationPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Authorized.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/MySqlOperationalIdentityFlow.Platform.cs'
      - 'backend/tests/Crecisol.C06StepUp.ContractsTests/**'
      - 'docs/c06/C06_05_ESPECIFICACION.md'
      - 'qa/c06_05_stepup_audits.py'
      - 'qa/c05_operational_flow_e2e.mjs'
      - '.github/workflows/c06-05-sensitive-step-up.yml'
permissions:
  contents: read
jobs:
  a-source:
    name: A | Approved Word, catalog and exact diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/master_source_guard.py
      - run: python3 qa/c06_01_permissions_catalog_audit.py A
      - run: python3 qa/c06_05_stepup_audits.py A
  b-security:
    name: B | Step-up operation realm, proof shape and purpose contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_05_stepup_audits.py B
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/tests/Crecisol.C06StepUp.ContractsTests/Crecisol.C06StepUp.ContractsTests.csproj -c Release -warnaserror
      - run: dotnet run --no-build -c Release --project backend/tests/Crecisol.C06StepUp.ContractsTests/Crecisol.C06StepUp.ContractsTests.csproj
  c-architecture:
    name: C | Domain separation and .NET 10 Angular 22 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_05_stepup_audits.py C
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: node --check qa/c05_operational_flow_e2e.mjs
      - name: Angular 22 unchanged functional/regression compile
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
  d-e2e:
    name: "E2E | Chromium Angular Kestrel MySQL: step-up and ABAC regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile real API, local SMTP receiver and test-only provisioner
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release -warnaserror
          dotnet build backend/tools/Crecisol.LocalIdentityProvisioner/Crecisol.LocalIdentityProvisioner.csproj -c Release -warnaserror
      - name: Angular + Chromium test runner
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Real sensitive-action proof and same-branch IDOR
        run: node qa/c05_operational_flow_e2e.mjs --c06-04 --c06-05
