name: CRECISOL C05-03 Argon2id Password Hash A-B-C real NET10
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PasswordHashingPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/Argon2idPasswordHasher.cs'
      - 'backend/src/Crecisol.Infrastructure/Crecisol.Infrastructure.csproj'
      - 'backend/tests/Crecisol.PasswordHash.ContractsTests/**'
      - 'qa/c05_03_password_audits.py'
      - 'docs/c05/C05_03_ESPECIFICACION.md'
      - '.github/workflows/c05-03-password-hashing.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Application/Identity/PasswordHashingPolicy.cs'
      - 'backend/src/Crecisol.Infrastructure/Identity/Argon2idPasswordHasher.cs'
      - 'backend/src/Crecisol.Infrastructure/Crecisol.Infrastructure.csproj'
      - 'backend/tests/Crecisol.PasswordHash.ContractsTests/**'
      - 'qa/c05_03_password_audits.py'
      - 'docs/c05/C05_03_ESPECIFICACION.md'
      - '.github/workflows/c05-03-password-hashing.yml'
permissions:
  contents: read
jobs:
  password-policy:
    name: Argon2id real .NET10 security A-B-C and C05-01/02 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Read-only SHA checkout with PR parents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word C05-02 predecessor and C05-03 scope
        run: |
          set -euo pipefail
          test ! -e .c05-03-password-proof
          python3 -m py_compile qa/c05_03_password_audits.py
          python3 qa/validate_foundation.py
          python3 qa/c05_03_password_audits.py A
          mkdir -p .c05-03-password-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-03-password-proof/A
      - name: Audit B remove adversarial guards and enforce strict resource bounds
        run: |
          set -euo pipefail
          python3 qa/c05_03_password_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-03-password-proof/B
      - name: Install pinned .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build real Argon2id and execute all positive and negative NET10 contracts
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.PasswordHash.ContractsTests/Crecisol.PasswordHash.ContractsTests.csproj
          printf 'PASS net10 sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-03-password-proof/net10
      - name: Regress C05-01 identity and C05-02 invitation model (no login)
        run: |
          set -euo pipefail
          dotnet build backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.AccountIdentity.ContractsTests/Crecisol.AccountIdentity.ContractsTests.csproj
          dotnet run --no-build -c Release --project backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj
          printf 'PASS oldcontract sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-03-password-proof/oldcontract
      - name: Audit C SHA/run, PR diff, backend architecture and E2E prohibition
        run: |
          set -euo pipefail
          python3 qa/c05_03_password_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-03-password-proof/C
      - name: Same-run source/security/runtime/integration gate
        run: |
          set -euo pipefail
          for stage in A B C net10 oldcontract; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-03-password-proof/$stage"
          done
          echo 'PASS C05-03 Argon2id only: no real users, production credentials, login, sessions or tenant grants'
