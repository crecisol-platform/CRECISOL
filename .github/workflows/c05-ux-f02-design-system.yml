name: CRECISOL C05 UX F02 institutional design system
on:
  push:
    branches: [feature/c05-ux-f02-sistema-institucional-20261119]
    paths:
      - 'frontend/src/app/ui/institutional-system/**'
      - 'frontend/angular.json'
      - 'frontend/tests/c05-f02-design-system.spec.ts'
      - 'frontend/tests/institutional-harness/**'
      - 'frontend/playwright.institutional.config.ts'
      - 'frontend/tsconfig.institutional.json'
      - 'qa/c05_ux_f02_design_system_audits.py'
      - 'docs/c05/ux/F02_*'
      - '.github/workflows/c05-ux-f02-design-system.yml'
permissions:
  contents: read
concurrency:
  group: c05-ux-f02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A/B/C audit static contracts and scope
        shell: bash
        run: |
          set -euo pipefail
          for gate in A B C; do
            python3 qa/c05_ux_f02_design_system_audits.py "$gate"
          done
          git diff --name-only f61a79d242288c686a88a7c3dd711f2be9a48c18...HEAD | while IFS= read -r path; do
            case "$path" in
              frontend/src/app/ui/institutional-system/*|frontend/angular.json|\
              frontend/tests/institutional-harness/*|frontend/tests/c05-f02-design-system.spec.ts|\
              frontend/playwright.institutional.config.ts|frontend/tsconfig.institutional.json|\
              qa/c05_ux_f02_design_system_audits.py|docs/c05/ux/F02_*|\
              .github/workflows/c05-ux-f02-design-system.yml) ;;
              *) echo "C05 F02 out-of-scope: $path"; exit 1 ;;
            esac
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install locked dependencies (no scripts)
        shell: bash
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: TypeScript and production Angular 22 build
        shell: bash
        run: |
          set -euo pipefail
          npm run check:types --prefix frontend
          npm run build --prefix frontend
      - name: Build isolated institutional component laboratory
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx ng build --configuration institutional-harness
      - name: Install Chromium for local-only tests
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium
      - name: Responsive + WCAG + scope + motion + branding
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.institutional.config.ts
      - name: Baseline C05 modal regression
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test tests/c05-institutional-modals.spec.ts --config=playwright.config.ts
      - name: Preserve local synthetic screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c05-f02-institutional-design-system-${{ github.sha }}
          path: |
            frontend/test-results-institutional/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
