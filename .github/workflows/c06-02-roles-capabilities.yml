name: CRECISOL C06-02 prepared roles and scoped capabilities A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Authorization/**'
      - 'backend/src/Crecisol.Application/Authorization/**'
      - 'backend/src/Crecisol.Infrastructure/Authorization/**'
      - 'backend/tests/Crecisol.PreparedRoles.MySqlTests/**'
      - 'backend/tests/Crecisol.PreparedRoles.ContractsTests/**'
      - 'database/migrations/019_c06_*'
      - 'database/tests/c06_02_*'
      - 'docs/c06/C06_02_*'
      - 'qa/c06_02_*'
      - '.github/workflows/c06-02-roles-capabilities.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Domain/Authorization/**'
      - 'backend/src/Crecisol.Application/Authorization/**'
      - 'backend/tests/Crecisol.PreparedRoles.ContractsTests/**'
      - 'database/migrations/019_c06_*'
      - 'database/tests/c06_02_*'
      - 'docs/c06/C06_02_*'
      - 'qa/c06_02_*'
      - '.github/workflows/c06-02-roles-capabilities.yml'
permissions:
  contents: read
jobs:
  a-traceability:
    name: A | Approved Word, canonical inventory and scoped diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/master_source_guard.py
      - run: python3 qa/c06_01_permissions_catalog_audit.py A
      - run: python3 qa/c06_02_role_model_audit.py A
      - run: python3 qa/c06_02_role_matrix_audit.py A
  b-security:
    name: B | .NET10 boundary negatives, MySQL 8.4 cross-tenant and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_01_permissions_catalog_audit.py B
      - run: python3 qa/c06_02_role_model_audit.py B
      - run: python3 qa/c06_02_role_matrix_audit.py B
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute independent .NET10 role contracts
        run: |
          dotnet build backend/tests/Crecisol.PreparedRoles.ContractsTests/Crecisol.PreparedRoles.ContractsTests.csproj -c Release -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.PreparedRoles.ContractsTests/Crecisol.PreparedRoles.ContractsTests.csproj
      - name: Disposable MySQL 8.4 tenant isolation, revision, audit, rollback
        run: bash database/tests/c06_02_prepared_roles_mysql.sh
  c-regression:
    name: C | .NET 10 Angular 22 compile, no policy activation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/c06_01_permissions_catalog_audit.py C
      - run: python3 qa/c06_02_role_model_audit.py C
      - run: python3 qa/c06_02_role_matrix_audit.py C
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release -warnaserror
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Angular compile; no C06 visual interface changed
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run check:types --prefix frontend
          npm run build --prefix frontend
