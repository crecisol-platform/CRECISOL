name: CRECISOL C05-02 independent synthetic SMTP receiver NET10 MySQL8.4 A-B-C
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Infrastructure/Identity/LoopbackOnlySmtpProofSink.cs'
      - 'backend/tests/Crecisol.LoopbackSmtpReceiver/**'
      - 'backend/tests/Crecisol.IndependentMailbox.MySqlTests/**'
      - 'database/tests/c05_02_independent_receiver_mysql_smoke.sh'
      - 'docs/c05/INTEGRACION_RECEPTOR_SMTP_INDEPENDIENTE_C05_02.md'
      - 'qa/c05_02_independent_smtp_audits.py'
      - '.github/workflows/c05-02-independent-smtp.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Infrastructure/Identity/LoopbackOnlySmtpProofSink.cs'
      - 'backend/tests/Crecisol.LoopbackSmtpReceiver/**'
      - 'backend/tests/Crecisol.IndependentMailbox.MySqlTests/**'
      - 'database/tests/c05_02_independent_receiver_mysql_smoke.sh'
      - 'docs/c05/INTEGRACION_RECEPTOR_SMTP_INDEPENDIENTE_C05_02.md'
      - 'qa/c05_02_independent_smtp_audits.py'
      - '.github/workflows/c05-02-independent-smtp.yml'
permissions:
  contents: read
jobs:
  independent-smtp-recipient:
    name: Local SMTP receiver process + one-use MySQL8.4 challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact read-only PR synthetic merge or dev
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical sources, synthetic sender and independent receiver
        run: |
          set -euo pipefail
          test ! -e .c05-02-independent-smtp
          python3 -m py_compile qa/c05_02_independent_smtp_audits.py
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c05_02_independent_smtp_audits.py A
          mkdir -p .c05-02-independent-smtp
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-independent-smtp/A
      - name: Audit B negative source guard mutations and boundary scan
        run: |
          set -euo pipefail
          python3 qa/c05_02_independent_smtp_audits.py B
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-independent-smtp/B
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Release warnings-as-errors compilations and C05 invitation regression
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.LoopbackSmtpReceiver/Crecisol.LoopbackSmtpReceiver.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.IndependentMailbox.MySqlTests/Crecisol.IndependentMailbox.MySqlTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.ProofOutbox.MySqlTests/Crecisol.ProofOutbox.MySqlTests.csproj -c Release --nologo -warnaserror
          dotnet build backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj -c Release --nologo -warnaserror
          dotnet run --no-build -c Release --project backend/tests/Crecisol.InvitationSecurity.ContractsTests/Crecisol.InvitationSecurity.ContractsTests.csproj
          printf 'PASS dotnet sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-independent-smtp/dotnet
      - name: REAL SMTP socket independent process and disposable MySQL8.4 proof
        run: |
          set -euo pipefail
          bash database/tests/c05_02_independent_receiver_mysql_smoke.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-independent-smtp/mysql
      - name: Audit C SHA, PR scope, A/B/runtime evidence and production guard
        run: |
          set -euo pipefail
          python3 qa/c05_02_independent_smtp_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-02-independent-smtp/C
      - name: Final exact SHA/run gate for A B C dotnet and MySQL8.4
        run: |
          set -euo pipefail
          for stage in A B C dotnet mysql; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-02-independent-smtp/$stage"
          done
          echo 'PASS C05-02 INDEPENDENT LOCAL SMTP TEST ONLY; NO EXTERNAL INBOX OR PRODUCTION CERTIFICATION'
