name: CRECISOL foundation check
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  foundation:
    name: Foundation scope and secrets baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate foundation and scope
        run: python3 qa/validate_foundation.py
