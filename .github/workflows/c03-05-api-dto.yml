name: CRECISOL C03-05 public API DTO validation A-B-C MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/**'
      - 'backend/tests/Crecisol.Api.ContractsTests/**'
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'qa/c03_05_*'
      - 'docs/c03/C03_05_*'
      - '.github/workflows/c03-05-api-dto.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Crecisol.Api/**'
      - 'backend/tests/Crecisol.Api.ContractsTests/**'
      - 'database/tests/c01_04_api_mysql_smoke.sh'
      - 'qa/c03_05_*'
      - 'docs/c03/C03_05_*'
      - '.github/workflows/c03-05-api-dto.yml'
permissions:
  contents: read
jobs:
  c03-05-api-contracts:
    if: startsWith(github.head_ref, 'feature/c03-05-') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CRECISOL without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Canonical source and typed API contract audit A
        run: |
          python3 -m py_compile qa/c03_05_api_audits.py qa/c03_05_http_smoke.py
          bash -n database/tests/c01_04_api_mysql_smoke.sh
          python3 qa/c03_05_api_audits.py A
      - name: Security and 12 rejected mutations audit B
        run: python3 qa/c03_05_api_audits.py B
      - name: Install real .NET10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build API and DTO test project Release warnings-as-errors
        run: |
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo
          dotnet build backend/tests/Crecisol.Api.ContractsTests/Crecisol.Api.ContractsTests.csproj -c Release --nologo
          mkdir -p .c03-05-ci-proof
          printf 'PASS: build\n' > .c03-05-ci-proof/build
      - name: Run typed DTO JSON allowlist and HTTP validator positive and negative tests
        run: |
          dotnet run --no-build -c Release --project backend/tests/Crecisol.Api.ContractsTests/Crecisol.Api.ContractsTests.csproj
          printf 'PASS: dto-tests\n' > .c03-05-ci-proof/dto-tests
      - name: Regression Domain Application and Infrastructure C01-C03
        run: |
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ContractsTests/Crecisol.Branding.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Branding.ApplicationTests/Crecisol.Branding.ApplicationTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Domain.ContractsTests/Crecisol.Domain.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Application.ContractsTests/Crecisol.Application.ContractsTests.csproj
          dotnet run -c Release --project backend/tests/Crecisol.Infrastructure.ContractsTests/Crecisol.Infrastructure.ContractsTests.csproj -- contracts
          printf 'PASS: regressions\n' > .c03-05-ci-proof/regressions
      - name: Real disposable MySQL8.4 SELECT-only and precise HTTP/DTO regression
        run: |
          CRECISOL_C03_05_CONTRACT_SMOKE=1 bash database/tests/c01_04_api_mysql_smoke.sh
          printf 'PASS: mysql-http\n' > .c03-05-ci-proof/mysql-http
      - name: Independent architecture performance and rollback audit C
        run: python3 qa/c03_05_api_audits.py C
