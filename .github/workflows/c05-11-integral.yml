name: CRECISOL C05-11 integral chapter identity A-B-C .NET10 Angular22 Chromium MySQL8.4
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/c05/C05_11_ESPECIFICACION.md'
      - 'docs/c05/C05_11_MATRIZ_RIESGOS.md'
      - 'qa/c05_11_integral_audits.py'
      - '.github/workflows/c05-11-integral.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/c05/C05_11_ESPECIFICACION.md'
      - 'docs/c05/C05_11_MATRIZ_RIESGOS.md'
      - 'qa/c05_11_integral_audits.py'
      - '.github/workflows/c05-11-integral.yml'
permissions:
  contents: read
jobs:
  chapter-c05-11:
    name: Integral 10 prior microphases A-B-C plus full real synthetic .NET10 MySQL8.4 Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - name: Checkout exact SHA with read-only token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Audit A canonical Word/PDF, 10 certified scopes, all 11 roadmap rows
        run: |
          set -euo pipefail
          test ! -e .c05-11-integral-proof
          python3 -m py_compile qa/c05_11_integral_audits.py
          python3 qa/validate_foundation.py
          python3 qa/master_source_guard.py --self-test
          python3 qa/c05_11_integral_audits.py A
          for n in 01 02 03 04 05 06 07 08 09 10; do
            case "$n" in
              01) file=qa/c05_01_identity_audits.py ;;
              02) file=qa/c05_02_scope_closure_audits.py ;;
              03) file=qa/c05_03_password_audits.py ;;
              04) file=qa/c05_04_contextual_login_audits.py ;;
              05) file=qa/c05_05_session_audits.py ;;
              06) file=qa/c05_06_recovery_audits.py ;;
              07) file=qa/c05_07_mailbox_audits.py ;;
              08) file=qa/c05_08_mfa_integration_audits.py ;;
              09) file=qa/c05_09_profile_audits.py ;;
              10) file=qa/c05_10_rate_limit_audits.py ;;
            esac
            python3 "$file" A
          done
          mkdir -p .c05-11-integral-proof
          printf 'PASS A sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/A
      - name: Audit B cross-tenant BOLA IDOR secret logs replay and hostile guard mutations
        run: |
          set -euo pipefail
          python3 qa/c05_11_integral_audits.py B
          for file in \
            qa/c05_01_identity_audits.py \
            qa/c05_02_scope_closure_audits.py \
            qa/c05_02_neutral_ingress_audits.py \
            qa/c05_02_privacy_retention_audits.py \
            qa/c05_02_signed_recipient_audits.py \
            qa/c05_03_password_audits.py \
            qa/c05_04_contextual_login_audits.py \
            qa/c05_05_session_audits.py \
            qa/c05_06_recovery_audits.py \
            qa/c05_07_mailbox_audits.py \
            qa/c05_08_mfa_crypto_audits.py \
            qa/c05_08_mfa_integration_audits.py \
            qa/c05_09_profile_audits.py \
            qa/c05_10_rate_limit_audits.py; do
            python3 "$file" B
          done
          python3 qa/c04_11_offensive_audits.py B
          for script in database/tests/c05_02_*mysql*.sh \
            database/tests/c05_05_session_http_mysql.sh \
            database/tests/c05_06_recovery_http_mysql.sh \
            database/tests/c05_07_mailbox_http_mysql.sh \
            database/tests/c05_08_mfa_http_mysql.sh \
            database/tests/c05_09_private_profiles_http_mysql.sh \
            database/tests/c05_10_rate_limit_http_mysql.sh; do
            bash -n "$script"
          done
          printf 'PASS B sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/B
      - name: Install official .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install approved Node24 for Angular22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Compile every current backend contract/project in .NET10 Release warnaserror
        run: |
          set -euo pipefail
          dotnet build backend/src/Crecisol.Api/Crecisol.Api.csproj -c Release --nologo -warnaserror
          while IFS= read -r project; do
            dotnet build "$project" -c Release --nologo -warnaserror
          done < <(find backend/tests -name '*.csproj' -type f | sort)
      - name: Run C05-01 through C05-04 contracts and cross-layer C04 host grants in .NET10
        run: |
          set -euo pipefail
          for proj in \
            Crecisol.AccountIdentity.ContractsTests \
            Crecisol.InvitationSecurity.ContractsTests \
            Crecisol.PasswordHash.ContractsTests \
            Crecisol.ContextualLogin.ContractsTests \
            Crecisol.MfaRisk.ContractsTests \
            Crecisol.TenantIdentity.ContractsTests \
            Crecisol.VerifiedHosts.ContractsTests \
            Crecisol.BranchResource.ContractsTests \
            Crecisol.TenantOffensive.ContractsTests; do
            dotnet run --no-build -c Release --project "backend/tests/$proj/$proj.csproj"
          done
          printf 'PASS dotnet sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/dotnet
      - name: Build Angular22 public design system strict types assets and npm production audit
        run: |
          set -euo pipefail
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
          npm audit --prefix frontend --omit=dev --audit-level=high
          npm run check:types --prefix frontend
          npm run build --prefix frontend
          npm run test:assets --prefix frontend
          printf 'PASS frontend sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/frontend
      - name: Run actual Chromium public private-path deny and mobile/a11y regressions
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test tests/c01-05.public-brand.spec.ts tests/c01-06.official-integration.spec.ts tests/c01-08.brand-revision.spec.ts tests/c02-03.public-information.spec.ts tests/c02-04.private-paths.spec.ts tests/c02-05.interaction-states.spec.ts tests/c02-07.mobile-accessibility.spec.ts tests/c02-08.journeys-public.spec.ts --reporter=line
          npm run test:c02-06
          npx playwright test --config=playwright.patterns-a11y.config.ts --reporter=line
          npx playwright test --config=playwright.journeys-patterns.config.ts --reporter=line
          cd ..
          printf 'PASS chromium sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/chromium
      - name: Real disposable MySQL8.4 all C05-02 invitation mailbox consent and retention contracts
        run: |
          set -euo pipefail
          bash database/tests/c05_02_invitation_atomic_smoke.sh
          bash database/tests/c05_02_dotnet_mysql_adapter_smoke.sh
          bash database/tests/c05_02_issuer_scope_mysql_smoke.sh
          bash database/tests/c05_02_bound_claim_mysql_smoke.sh
          bash database/tests/c05_02_mailbox_proof_mysql_smoke.sh
          bash database/tests/c05_02_signed_recipient_mysql_smoke.sh
          bash database/tests/c05_02_neutral_registration_http_mysql.sh
          bash database/tests/c05_02_mailbox_bound_mysql_smoke.sh
          bash database/tests/c05_02_independent_receiver_mysql_smoke.sh
          bash database/tests/c05_02_proof_outbox_mysql_smoke.sh
          bash database/tests/c05_02_privacy_retention_mysql.sh
          bash database/tests/c04_11_offensive_sql.sh
      - name: Real disposable MySQL8.4 C05-05 through C05-10 sessions recovery mail MFA profiles rate limit
        run: |
          set -euo pipefail
          bash database/tests/c05_05_session_http_mysql.sh
          bash database/tests/c05_06_recovery_http_mysql.sh
          bash database/tests/c05_07_mailbox_http_mysql.sh
          bash database/tests/c05_08_mfa_http_mysql.sh
          bash database/tests/c05_09_private_profiles_http_mysql.sh
          bash database/tests/c05_10_rate_limit_http_mysql.sh
          printf 'PASS mysql sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/mysql
      - name: Audit C actual same-SHA full chapter evidence strict four-file diff and rollback
        run: |
          set -euo pipefail
          python3 qa/c05_11_integral_audits.py C
          printf 'PASS C sha=%s run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .c05-11-integral-proof/C
      - name: Final six proof files same immutable SHA and run; no product auth or C06 authorization
        run: |
          set -euo pipefail
          for stage in A B C dotnet mysql frontend chromium; do
            grep -Fqx "PASS $stage sha=$GITHUB_SHA run=$GITHUB_RUN_ID" ".c05-11-integral-proof/$stage"
          done
          echo 'PASS C05-11 integrated synthetic-only A/B/C. Never claim real accounts, production sessions, MFA or protected C06 without integration.'
