<dialog #surface class="cs-modal" [class.cs-modal--wide]="wide()"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (cancel)="onCancel($event)" (close)="onClosed()" (click)="onDialogClick($event)" (submit)="onDialogSubmit()">
  <header class="cs-modal__header">
    <div class="cs-modal__heading">
      <h2 #heading tabindex="-1" [id]="titleId">{{ title() }}</h2>
      @if (description()) { <p class="cs-modal__description" [id]="descriptionId">{{ description() }}</p> }
    </div>
    <button type="button" class="cs-modal__dismiss" aria-label="Cerrar ventana"
      [disabled]="busy()" (click)="close()">×</button>
  </header>
  <div #scrollBody class="cs-modal__content" role="region" aria-label="Contenido de la operación" tabindex="0">
    @if (localError()) { <p class="cs-modal__feedback cs-modal__feedback--error" role="alert">{{ localError() }}</p> }
    @if (localFeedback()) { <p class="cs-modal__feedback" role="status" aria-live="polite">{{ localFeedback() }}</p> }
    <ng-content></ng-content>
  </div>
  <footer class="cs-modal__footer">
    <span>Acción protegida · Nunca compartas tus códigos.</span>
    <button type="button" class="cs-modal__cancel" [disabled]="busy()" (click)="close()">Cerrar</button>
  </footer>
</dialog>
